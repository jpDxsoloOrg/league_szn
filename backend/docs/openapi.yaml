  # ── Dashboard & Activity ──────────────────────────────────────────

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard overview
      responses:
        '200': { description: Dashboard data with current champions, upcoming events, recent results, season info, quick stats }

  /ticker:
    get:
      tags: [Dashboard]
      summary: Get the league ticker feed (public)
      description: >
        Ordered ticker segments built from league data. Empty segments are left out;
        segments are sorted by `priority` ascending, with pinned GM messages first.
        Keys: pinned, tonight, newChampions, potentialCallups, promotionWatch,
        hotRivalries, custom, news, upcomingShows, champions, latestResults.
        Segments turned off in the ticker settings are left out, and with the
        `ticker` feature off the list is empty.
        Sent with `Cache-Control: public, max-age=60`.
      responses:
        '200':
          description: Ticker segments
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  segments:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        labelKey: { type: string, description: 'i18n key, e.g. ticker.segments.tonight' }
                        priority: { type: integer, description: Lower comes first }
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              text: { type: string, description: Display text (English fallback when textKey is set) }
                              href: { type: string, description: In-app path }
                              textKey: { type: string, description: Optional i18n key for templated text }
                              textParams: { type: object, additionalProperties: true }

  /activity:
    get:
      tags: [Activity]
      summary: Get activity feed
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
          description: Pagination cursor (timestamp|id)
        - name: type
          in: query
          schema: { type: string, enum: [match, championship, challenge, promo, tournament, season, callup, promotion, relegation, division] }
          description: >
            `callup` returns both item types: `callup_consideration` (current marks) and `callup_executed`.
            `promotion` returns `promotion_watch` (current GM marks, public). `relegation` returns
            `relegation_watch`, which only Moderator+ get (send a bearer token) unless the
            `publicRelegationWatch` ticker setting is on; it is never in the public feed otherwise.
            `division` returns `division_promotion` and `division_relegation`; a relegation is listed
            only when its announcement was opted in. Unknown values are ignored.
      responses:
        '200':
          description: Paginated activity items
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { type: object } }
                  nextCursor: { type: string, nullable: true }

