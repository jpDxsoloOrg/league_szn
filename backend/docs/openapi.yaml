  # ── Progression: execute (CUP-06) ──────────────────────────────────

  /progression/players/{playerId}/execute:
    post:
      tags: [Progression]
      summary: Execute a division move (call-up, promotion, relegation)
      description: >-
        Moves the player from the track's source division to `toDivisionId`
        (defaults to the track's target), deletes their progression row for the
        track and records an `executed` event (plus `consideration_removed` if
        they were under consideration) in one transaction. The same transaction
        resets the player's rows on every other track out of the old division.
        Then, best-effort: notifies the wrestler, optionally publishes a News
        announcement (opt-in), recomputes their progression and recalculates
        contenders. A call-up cannot target a developmental division. Without a
        target, a promotion / relegation moves one tier up / down (DMV-05); an
        explicit promotion / relegation target must rank above / below the
        source when both divisions are on the tier ladder.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string }
                toDivisionId: { type: string, description: 'Defaults to the track target. Required for a call-up whose track has none; a promotion or relegation without one uses the division one tier up or down' }
                announce: { type: boolean, description: Publish a News announcement }
                force: { type: boolean, description: Proceed even if the player holds a title restricted to the old division }
      responses:
        '200':
          description: Move executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId: { type: string }
                  trackId: { type: string }
                  kind: { type: string, enum: [callup, promotion, relegation] }
                  fromDivisionId: { type: string }
                  toDivisionId: { type: string }
                  divisionJoinedAt: { type: string, format: date-time }
                  progressionEpochAt: { type: string, format: date-time, description: Same as divisionJoinedAt; the move restarts every progression track }
                  event: { type: object, description: The executed ProgressionEvent }
                  announcementId: { type: string }
        '400':
          description: >-
            Bad request, or code TARGET_IS_DEVELOPMENTAL, TRACK_INACTIVE,
            NO_DIVISION_ABOVE (top tier), NO_DIVISION_BELOW, TARGET_NOT_ABOVE,
            TARGET_NOT_BELOW, or AMBIGUOUS_TARGET (several sibling divisions
            qualify; `candidates` lists them, retry with toDivisionId)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, enum: [TARGET_IS_DEVELOPMENTAL, TRACK_INACTIVE, NO_DIVISION_ABOVE, NO_DIVISION_BELOW, TARGET_NOT_ABOVE, TARGET_NOT_BELOW, AMBIGUOUS_TARGET] }
                  candidates:
                    type: array
                    items:
                      type: object
                      properties:
                        divisionId: { type: string }
                        name: { type: string }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Track, player or target division not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: >-
            code NOT_IN_SOURCE_DIVISION (with playerDivisionId, fromDivisionId), or
            code HOLDS_DIVISION_TITLE (with championships [{championshipId, name}]; retry with force true), or code CONCURRENT_UPDATE (another request moved the player first; reload)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  code: { type: string, enum: [NOT_IN_SOURCE_DIVISION, HOLDS_DIVISION_TITLE, CONCURRENT_UPDATE] }
                  championships:
                    type: array
                    items:
                      type: object
                      properties:
                        championshipId: { type: string }
                        name: { type: string }

  /progression/players/{playerId}/reset-goals:
    post:
      tags: [Progression]
      summary: Reset a player's progression goals (Admin, Moderator)
      description: >-
        Restarts the player's call-up, promotion and relegation goals without
        moving them. One transaction sets `progressionEpochAt` to now, deletes
        every PlayerProgression row for the player (logging
        `consideration_removed` for any row under consideration) and appends one
        `goals_reset` event per track out of the player's current division.
        `divisionJoinedAt`, win/loss/draw totals and season standings are never
        touched. Then, best-effort: recomputes the player's progression and
        notifies them.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Goals reset
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId: { type: string }
                  progressionEpochAt: { type: string, format: date-time }
                  deletedTrackIds: { type: array, items: { type: string } }
                  events: { type: array, items: { type: object }, description: The goals_reset ProgressionEvents }
        '400': { description: 'Bad request, or the player has no progression tracks in their current division', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Player not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Another request moved the player first; reload', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

