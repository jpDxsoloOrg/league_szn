openapi: 3.0.3
info:
  title: WWE 2K League API
  version: 1.0.0
  description: Serverless API for managing a WWE 2K league (standings, championships, matches, tournaments, events, challenges, promos, statistics). Authenticated endpoints require a JWT Bearer token (AWS Cognito).
  license:
    name: Unlicense
    url: https://unlicense.org

# Default: no auth required. Override with security: [{ BearerAuth: [] }] on protected operations.
security: []

servers:
  - url: http://localhost:3001/dev
    description: Local (serverless-offline)
  - url: https://dgsmskbzb2.execute-api.us-east-1.amazonaws.com/devtest
    description: Devtest
  - url: https://9pcccl0caj.execute-api.us-east-1.amazonaws.com/dev
    description: Dev/Prod

tags:
  - name: Auth
  - name: Users
  - name: Site Config
  - name: Profile
  - name: Players
  - name: Matches
  - name: Championships
  - name: Tournaments
  - name: Standings
  - name: Seasons
  - name: Divisions
  - name: Stipulations
  - name: Match Types
  - name: Events
  - name: Contenders
  - name: Images
  - name: Admin
  - name: Challenges
  - name: Promos
  - name: Statistics
  - name: Dashboard
  - name: Activity
  - name: Rivalries
  - name: Season Awards
  - name: Companies
  - name: Shows
  - name: Locations
  - name: Wrestlers
  - name: Stables
  - name: Tag Teams
  - name: Videos
  - name: Announcements
  - name: Notifications
  - name: Transfers
  - name: Progression
  - name: Storyline Requests
  - name: Overalls

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from AWS Cognito (login or admin).

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Player:
      type: object
      properties:
        playerId: { type: string }
        userId: { type: string }
        name: { type: string }
        currentWrestler: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        imageUrl: { type: string }
        divisionId: { type: string }
        discipline:
          description: Only for staff and the player themselves.
          allOf: [{ $ref: '#/components/schemas/PlayerDisciplineSummary' }]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # BLD-03: wrestler builds
    CoreStats:
      type: object
      required: [strikes, grapple, agility, endurance]
      properties:
        strikes: { type: integer }
        grapple: { type: integer }
        agility: { type: integer }
        endurance: { type: integer }
    WrestlerBuild:
      type: object
      required: [style, stats, updatedAt]
      properties:
        style: { type: string, enum: [powerhouse, technician, highFlyer, brawler, striker, allRounder] }
        specialty:
          type: string
          enum: [highRisk, technical, endurance, hardcore, cage]
          description: Must be one the style allows. Absent when none is picked.
        stats: { $ref: '#/components/schemas/CoreStats' }
        updatedAt: { type: string, description: Empty for the default build }
    LeveledMove:
      type: object
      required: [gameName, customName, level]
      properties:
        gameName: { type: string }
        customName: { type: string }
        level: { type: integer, minimum: 1, maximum: 5 }
    BuildBudgetStatus:
      type: object
      required: [cost, budget, remaining, overBudget]
      properties:
        cost: { type: integer }
        budget: { type: integer, description: From the player's current division tier }
        remaining: { type: integer, description: Negative when over budget }
        overBudget: { type: boolean }
    EffectiveBuild:
      type: object
      required: [style, stats, spentStats, signatureLevels, finisherLevels, scaled, status]
      properties:
        style: { type: string }
        specialty: { type: string }
        stats: { allOf: [{ $ref: '#/components/schemas/CoreStats' }], description: 'Scaled to the budget, plus the style bonus, capped at 100' }
        spentStats: { allOf: [{ $ref: '#/components/schemas/CoreStats' }], description: After scaling, before the style bonus }
        signatureLevels: { type: array, items: { type: integer } }
        finisherLevels: { type: array, items: { type: integer } }
        scaled: { type: boolean, description: True when the saved build was over budget and was scaled down }
        status: { $ref: '#/components/schemas/BuildBudgetStatus' }
    PlayerBuild:
      type: object
      required: [playerId, build, isDefault, moves, budget, effective, rulesVersion]
      properties:
        playerId: { type: string }
        build: { $ref: '#/components/schemas/WrestlerBuild' }
        isDefault: { type: boolean, description: True when the player never saved a build }
        moves:
          type: object
          properties:
            signatures: { type: array, items: { $ref: '#/components/schemas/LeveledMove' } }
            finishers: { type: array, items: { $ref: '#/components/schemas/LeveledMove' } }
        budget: { $ref: '#/components/schemas/BuildBudgetStatus' }
        effective: { $ref: '#/components/schemas/EffectiveBuild' }
        rulesVersion: { type: integer }
    SavePlayerBuildInput:
      type: object
      required: [style, stats]
      properties:
        style: { type: string, enum: [powerhouse, technician, highFlyer, brawler, striker, allRounder] }
        specialty:
          type: string
          nullable: true
          enum: [highRisk, technical, endurance, hardcore, cage]
          description: Null or missing clears it.
        stats: { $ref: '#/components/schemas/CoreStats' }
        moveLevels:
          type: object
          description: One level per stored move, in order. A list that is left out keeps the current levels.
          properties:
            signatures: { type: array, items: { type: integer, minimum: 1, maximum: 5 } }
            finishers: { type: array, items: { type: integer, minimum: 1, maximum: 5 } }
    BuildValidationError:
      type: object
      required: [code, field, message]
      properties:
        code:
          type: string
          enum: [INVALID_STYLE, INVALID_SPECIALTY, SPECIALTY_NOT_ALLOWED, INVALID_STATS, MISSING_STAT, UNKNOWN_STAT, INVALID_STAT, INVALID_MOVE_LEVEL, OVER_BUDGET]
        field: { type: string, example: stats.grapple }
        message: { type: string }
        details: { type: object, additionalProperties: true, description: 'e.g. { cost, budget } or { style, allowed }' }
    BuildRules:
      type: object
      description: Every build rule, from lib/policies/buildRules.ts.
      properties:
        rulesVersion: { type: integer }
        stats:
          type: object
          properties:
            coreStats: { type: array, items: { type: string } }
            base: { type: integer }
            cap: { type: integer }
            costBands:
              type: array
              items:
                type: object
                properties: { from: { type: integer }, to: { type: integer }, costPerPoint: { type: integer } }
        moves:
          type: object
          properties:
            minLevel: { type: integer }
            maxLevel: { type: integer }
            signatureLevelCost: { type: integer }
            finisherLevelCost: { type: integer }
        budgets:
          type: object
          properties:
            tiers: { type: object, additionalProperties: { type: integer }, description: Budget by tier number }
            defaultTier: { type: integer }
            developmental: { type: integer }
            noDivision: { type: integer }
        styles:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              statBonuses: { type: object, additionalProperties: { type: integer } }
              beats: { type: string, nullable: true }
              beatenBy: { type: string, nullable: true }
              specialties: { type: array, items: { type: string } }
              specialtyBonus: { type: number }
        styleBeats: { type: object, additionalProperties: { type: string } }
        styleEdge: { type: number }
        simCategories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              examples: { type: array, items: { type: string } }
        specialtyCategories: { type: array, items: { type: string } }
        styleSpecialties: { type: object, additionalProperties: { type: array, items: { type: string } } }
        specialtyBonus: { type: number }
        allRounderSpecialtyBonus: { type: number }

    FormResult:
      type: string
      enum: [W, L, D]

    Streak:
      type: object
      required: [type, count]
      properties:
        type: { $ref: '#/components/schemas/FormResult' }
        count: { type: integer }

    DivisionRecord:
      type: object
      description: >-
        Record in the player's current division. Counts only completed matches
        whose result time (completedAt, else date) is on or after divisionJoinedAt,
        within the requested season when seasonId is given. A player with no
        divisionJoinedAt gets the same W-L-D as the row (career or season).
        League points use the same rule: each player is credited only for results
        since they joined, and opponents are judged on their points in this
        division's table, so a player who just moved starts at 0 points.
      required: [wins, losses, draws, recentForm, currentStreak, points, qualityWins, streakBonuses, sos, rank]
      properties:
        points: { type: integer, description: League points in this division's table. }
        qualityWins: { type: integer }
        streakBonuses: { type: integer }
        sos: { type: number, description: Strength of schedule within this division's table. }
        rank:
          type: integer
          description: 1-based rank among the returned players of this division, by league points. Tied rows share a rank.
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        recentForm:
          type: array
          maxItems: 5
          description: Newest first.
          items: { $ref: '#/components/schemas/FormResult' }
        currentStreak: { $ref: '#/components/schemas/Streak' }
        since:
          type: string
          format: date-time
          description: The divisionJoinedAt the record counts from. Omitted when the player has never moved division.

    StandingsPlayer:
      allOf:
        - $ref: '#/components/schemas/Player'
        - type: object
          required: [divisionRecord, points, qualityWins, streakBonuses, sos, rank]
          properties:
            points:
              type: integer
              description: >-
                League points for the requested window (season or all time): 3 per
                win, 1 per draw, plus quality-win and streak bonuses. Hidden
                opponents still count.
            qualityWins:
              type: integer
              description: Wins over an opponent who had more points going in, or held a title.
            streakBonuses:
              type: integer
              description: Bonuses for every third win in a row.
            sos:
              type: number
              description: Strength of schedule, the mean points per match of every opponent faced (3 decimals).
            rank:
              type: integer
              description: >-
                1-based rank in the returned list. Players with no matches come
                last; then points, sos, head-to-head, win %, wins. Tied rows share a rank.
            divisionJoinedAt: { type: string, format: date-time }
            mainOverall: { type: integer }
            recentForm:
              type: array
              maxItems: 5
              description: Newest first.
              items: { $ref: '#/components/schemas/FormResult' }
            currentStreak: { $ref: '#/components/schemas/Streak' }
            divisionRecord: { $ref: '#/components/schemas/DivisionRecord' }

    Refusal:
      type: object
      required: [message, code]
      properties:
        message: { type: string, description: English. Clients translate by code. }
        code:
          type: string
          enum:
            - SIGNUP_BLOCKED
            - PLAYER_DEACTIVATED
            - PLAYER_UNAVAILABLE
            - ALREADY_DEACTIVATED
            - NOT_DEACTIVATED
            - STAFF_PROTECTED
            - DISCIPLINE_CONFLICT
            - STRIKE_NOT_ACTIVE
            - DISCIPLINE_ACTIVE
            - PSN_ID_UNAVAILABLE
            - PSN_ID_LOCKED
        blockedUntil: { type: string, format: date-time }

    StrikeOutcome:
      type: string
      enum: [warned, signup-blocked, deactivated]

    PlayerDisciplineSummary:
      type: object
      required: [status, activeStrikeCount, activeStrikes, cooldownEndsAt, signupBlockedUntil, deactivatedAt]
      properties:
        status:
          type: string
          enum: [clear, warned, signup-blocked, cooldown, deactivated]
        activeStrikeCount: { type: integer }
        activeStrikes:
          type: array
          description: Oldest first. Issuer identity is left out on purpose.
          items:
            type: object
            required: [strikeId, issuedAt, reason]
            properties:
              strikeId: { type: string }
              issuedAt: { type: string, format: date-time }
              reason: { type: string }
        cooldownEndsAt: { type: string, format: date-time, nullable: true }
        signupBlockedUntil:
          type: string
          format: date-time
          nullable: true
          description: Non-null only while status is signup-blocked.
        deactivatedAt: { type: string, format: date-time, nullable: true }

    PlayerStrike:
      type: object
      required: [strikeId, issuedAt, issuedBy, issuedByName, reason]
      properties:
        strikeId: { type: string }
        issuedAt: { type: string, format: date-time }
        issuedBy: { type: string }
        issuedByName: { type: string }
        reason: { type: string }
        clearedAt: { type: string, format: date-time }
        clearedBy: { type: string }
        clearedByName: { type: string }
        clearedReason: { type: string }
        clearedKind: { type: string, enum: [removed, reactivated] }

    PlayerDeactivation:
      type: object
      required: [deactivatedAt, deactivatedBy, deactivatedByName, strikeId]
      properties:
        deactivatedAt: { type: string, format: date-time }
        deactivatedBy: { type: string }
        deactivatedByName: { type: string }
        strikeId: { type: string }
        cognitoAlreadyDisabled: { type: boolean }
        reactivatedAt: { type: string, format: date-time }
        reactivatedBy: { type: string }
        reactivatedByName: { type: string }
        reactivationReason: { type: string }

    DisciplineHoldings:
      type: object
      required: [titles, matches, challenges, tournaments]
      properties:
        titles:
          type: array
          items:
            type: object
            properties:
              championshipId: { type: string }
              name: { type: string }
        matches:
          type: array
          items:
            type: object
            properties:
              matchId: { type: string }
              date: { type: string, format: date-time }
              status: { type: string, enum: [scheduled, open-signups] }
              matchFormat: { type: string }
              opponents:
                type: array
                description: Names of the other side, partners left out. Empty while the other spots are open.
                items: { type: string }
              eventId: { type: string }
              tournamentId: { type: string }
        challenges:
          type: array
          items:
            type: object
            properties:
              challengeId: { type: string }
              opponentName: { type: string }
        tournaments:
          type: array
          items:
            type: object
            properties:
              tournamentId: { type: string }
              name: { type: string }
              status: { type: string }

    PlayerDisciplineDetail:
      type: object
      required:
        - playerId
        - version
        - summary
        - nextStrikeOutcome
        - strikes
        - deactivations
        - hasLinkedAccount
        - isStaffAccount
        - accountEnabled
        - holdings
      properties:
        playerId: { type: string }
        version: { type: integer, description: Send back as expectedVersion. }
        summary: { $ref: '#/components/schemas/PlayerDisciplineSummary' }
        nextStrikeOutcome:
          description: Null while deactivated. Send back as expectedOutcome.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/StrikeOutcome' }]
        strikes:
          type: array
          description: Full history, newest first.
          items: { $ref: '#/components/schemas/PlayerStrike' }
        deactivations:
          type: array
          description: Newest first.
          items: { $ref: '#/components/schemas/PlayerDeactivation' }
        hasLinkedAccount: { type: boolean, description: False for an unlinked player or a dead link. }
        isStaffAccount: { type: boolean, nullable: true, description: False when unlinked. Null on a Cognito error. }
        accountEnabled: { type: boolean, nullable: true, description: Null when unlinked or on a Cognito error. }
        holdings: { $ref: '#/components/schemas/DisciplineHoldings' }

    LedgerEntry:
      type: object
      required: [playerId, entryId, createdAt, sortKey, kind, amount, balanceAfter, idempotencyKey]
      properties:
        playerId: { type: string }
        entryId: { type: string }
        createdAt: { type: string, format: date-time }
        sortKey: { type: string, description: '`createdAt#entryId`' }
        kind:
          type: string
          enum: [perMatchPay, winBonus, salary, fine, fineRescinded, purchase, refund, gmAdjust, reversal]
        amount: { type: integer, description: Signed amount }
        balanceAfter: { type: integer }
        refType: { type: string }
        refId: { type: string }
        note: { type: string }
        actorUserId: { type: string }
        idempotencyKey: { type: string }
    # ECO-13
    OwnLedgerEntry:
      type: object
      required: [playerId, entryId, createdAt, sortKey, kind, amount, balanceAfter]
      properties:
        playerId: { type: string }
        entryId: { type: string }
        createdAt: { type: string, format: date-time }
        sortKey: { type: string }
        kind:
          type: string
          enum: [perMatchPay, winBonus, salary, fine, fineRescinded, purchase, refund, gmAdjust, reversal]
        amount: { type: integer, description: Signed amount }
        balanceAfter: { type: integer }
        refType: { type: string }
        refId: { type: string }
        note: { type: string, description: The fine reason or GM note }

    AdjustBalanceResult:
      type: object
      required: [entry, balance, alreadyApplied]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        balance: { type: integer }
        alreadyApplied: { type: boolean }

    # ECO-04: contracts
    Contract:
      type: object
      required: [contractId, playerId, type, status, matchesPlayed, perMatchPay, weeklySalary, winBonus, offeredBy, offeredAt, offerExpiresAt, createdAt, updatedAt]
      properties:
        contractId: { type: string }
        playerId: { type: string }
        type: { type: string, enum: [tryout, matches, season] }
        status: { type: string, enum: [offered, active, declined, withdrawn, expired, completed, released] }
        matchesTotal: { type: integer, description: Tryout and matches contracts only }
        matchesPlayed: { type: integer }
        seasonId: { type: string, description: Season contracts only }
        perMatchPay: { type: integer }
        weeklySalary: { type: integer }
        winBonus: { type: integer }
        offeredBy: { type: string, description: User id of the GM who made the offer }
        offeredAt: { type: string, format: date-time }
        offerExpiresAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        endReason:
          type: string
          enum: [offerDeclined, offerWithdrawn, otherOfferAccepted, offerExpired, matchesCompleted, seasonEnded, released]
        note: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PublicContract:
      type: object
      description: A contract without money, the offering GM or notes.
      required: [contractId, playerId, type, status, matchesPlayed]
      properties:
        contractId: { type: string }
        playerId: { type: string }
        type: { type: string, enum: [tryout, matches, season] }
        status: { type: string, enum: [offered, active, declined, withdrawn, expired, completed, released] }
        matchesTotal: { type: integer }
        matchesPlayed: { type: integer }
        seasonId: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
    ContractOfferInput:
      type: object
      required: [playerId, type]
      description: >-
        Pay fields left out take the economy settings' defaults for the type.
        A tryout's matchesTotal defaults to the tryout length; a season
        contract's seasonId defaults to the active season.
      properties:
        playerId: { type: string }
        type: { type: string, enum: [tryout, matches, season] }
        matchesTotal: { type: integer, minimum: 1 }
        seasonId: { type: string }
        perMatchPay: { type: integer, minimum: 0 }
        weeklySalary: { type: integer, minimum: 0 }
        winBonus: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 500 }
    # ECO-07
    MatchNoShow:
      type: object
      required: [playerId, markedAt]
      description: One no-show mark. Undoing it stamps `undoneAt`; active marks have none.
      properties:
        playerId: { type: string }
        markedAt: { type: string, format: date-time }
        undoneAt: { type: string, format: date-time }
    NoShowResult:
      type: object
      required: [matchId, playerId, noShow, entry, balance, alreadyApplied]
      properties:
        matchId: { type: string }
        playerId: { type: string }
        noShow: { $ref: '#/components/schemas/MatchNoShow' }
        entry:
          type: object
          allOf: [{ $ref: '#/components/schemas/LedgerEntry' }]
          nullable: true
          description: The fine (mark) or its refund (undo); null when nothing was posted.
        balance: { type: integer }
        alreadyApplied: { type: boolean }
    RescindFineResult:
      type: object
      required: [entry, fine, balance, alreadyApplied]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        fine: { $ref: '#/components/schemas/LedgerEntry' }
        balance: { type: integer }
        alreadyApplied: { type: boolean }

    DisciplineActionResult:
      type: object
      required: [playerId, version, summary, accountSync, softHoldsCleared, holdings]
      properties:
        playerId: { type: string }
        version: { type: integer }
        summary: { $ref: '#/components/schemas/PlayerDisciplineSummary' }
        accountSync:
          type: string
          enum: [ok, failed, not-linked, not-needed]
          description: not-needed means no Cognito change was due.
        softHoldsCleared: { type: boolean, description: False only when cleanup was due and did not finish. }
        holdings:
          description: Filled only when the action deactivated the player.
          allOf: [{ $ref: '#/components/schemas/DisciplineHoldings' }]

    Match:
      type: object
      properties:
        matchId: { type: string }
        date: { type: string }
        matchFormat: { type: string }
        stipulationId: { type: string }
        participants: { type: array, items: { type: string } }
        teams: { type: array, items: { type: array, items: { type: string } } }
        sideTagTeams:
          type: array
          description: >-
            Read-only, set when the match has `teams`. One entry per side, aligned
            with `teams`: the tag team that side's pair was on the match date, or
            null for a side that isn't a registered pair. Resolved at read time, so
            a renamed team shows its current name. Also set on event
            `enrichedMatches[].matchData` and dashboard `recentResults[]`.
          items:
            nullable: true
            allOf: [{ $ref: '#/components/schemas/SideTagTeam' }]
        winners: { type: array, items: { type: string } }
        losers: { type: array, items: { type: string } }
        winningTeam: { type: integer }
        isChampionship: { type: boolean }
        isTitleDefense: { type: boolean }
        championshipId: { type: string }
        tournamentId: { type: string }
        seasonId: { type: string }
        status: { type: string, enum: [scheduled, completed] }
        noShows:
          type: array
          description: No-show marks (ECO-07), oldest first; active ones have no `undoneAt`.
          items: { $ref: '#/components/schemas/MatchNoShow' }
        createdAt: { type: string }
        challengeId: { type: string }
        promoId: { type: string }

    SideTagTeam:
      type: object
      required: [tagTeamId, name]
      properties:
        tagTeamId: { type: string }
        name: { type: string }
        imageUrl: { type: string }

    ScheduleMatchInput:
      type: object
      required: [matchFormat, participants, isChampionship, status]
      properties:
        date: { type: string }
        matchFormat: { type: string }
        stipulationId: { type: string }
        participants: { type: array, items: { type: string } }
        teams: { type: array, items: { type: array, items: { type: string } } }
        isChampionship: { type: boolean }
        championshipId: { type: string }
        tournamentId: { type: string }
        seasonId: { type: string }
        eventId: { type: string }
        designation: { type: string }
        status: { type: string, enum: [scheduled] }
        challengeId: { type: string }
        promoId: { type: string }

    RecordResultInput:
      type: object
      properties:
        winners: { type: array, items: { type: string } }
        losers: { type: array, items: { type: string } }
        winningTeam: { type: integer }

    Championship:
      type: object
      properties:
        championshipId: { type: string }
        name: { type: string }
        type: { type: string, enum: [singles, tag] }
        currentChampion: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        currentTagTeamId: { type: string, description: 'Tag titles only. The registered tag team holding the title; absent for a random pairing.' }
        currentTagTeamName: { type: string, description: 'Name of currentTagTeamId, added on read.' }
        divisionId: { type: string }
        imageUrl: { type: string }
        createdAt: { type: string }
        isActive: { type: boolean }

    ChampionshipReign:
      type: object
      properties:
        championshipId: { type: string }
        champion: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        tagTeamId: { type: string, description: 'Tag reigns only. The registered tag team that won this reign.' }
        tagTeamName: { type: string, description: 'Name of tagTeamId, added on read.' }
        wonDate: { type: string }
        lostDate: { type: string }
        matchId: { type: string }
        daysHeld: { type: integer }
        defenses: { type: integer }

    Tournament:
      type: object
      properties:
        tournamentId: { type: string }
        name: { type: string }
        type: { type: string, enum: [single-elimination, round-robin] }
        status: { type: string, enum: [upcoming, in-progress, completed] }
        participants: { type: array, items: { type: string } }
        brackets: { $ref: '#/components/schemas/TournamentBracket' }
        standings: { type: object }
        winner: { type: string }
        createdAt: { type: string }

    TournamentBracket:
      type: object
      properties:
        rounds: { type: array, items: { $ref: '#/components/schemas/BracketRound' } }

    BracketRound:
      type: object
      properties:
        roundNumber: { type: integer }
        matches: { type: array, items: { $ref: '#/components/schemas/BracketMatch' } }

    BracketMatch:
      type: object
      properties:
        matchId: { type: string }
        participant1: { type: string }
        participant2: { type: string }
        winner: { type: string }

    RoundRobinStanding:
      type: object
      properties:
        playerId: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        points: { type: integer }

    Standings:
      type: object
      properties:
        players: { type: array, items: { $ref: '#/components/schemas/StandingsPlayer' } }
        seasonId: { type: string }
        rankedBy: { type: string, enum: [points] }
        sortedByWins: { type: boolean, deprecated: true }

    Season:
      type: object
      properties:
        seasonId: { type: string }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        status: { type: string, enum: [active, completed] }
        createdAt: { type: string }
        updatedAt: { type: string }

    Division:
      type: object
      properties:
        divisionId: { type: string }
        name: { type: string }
        description: { type: string }
        isDevelopmental:
          type: boolean
          description: Developmental (feeder) division, such as Young Boys.
        isDefaultForNewWrestlers:
          type: boolean
          description: New sign-ups land in this division. Setting it to true clears it on the previous default; at most one division carries it.
        tier:
          type: integer
          nullable: true
          minimum: 1
          maximum: 99
          description: Ladder position, 1 = top. Divisions with the same tier are siblings. Developmental divisions rank below every tiered division. Send null on update to clear it.
        promotionZoneSize:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: Top N of this division's standings shown as the promotion zone. Unset means 2; 0 disables. The top tier never shows one. Send null on update to reset to the default.
        relegationZoneSize:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: Bottom N of this division's standings shown as the relegation zone. Unset means 2; 0 disables. Only shown when a division sits below, and only to GMs unless the publicRelegationWatch ticker setting is on. Send null on update to reset to the default.
        createdAt: { type: string }
        updatedAt: { type: string }

    # BLD-16
    SimCategory:
      type: string
      enum: [standard, highRisk, technical, endurance, hardcore, cage]
      description: Sim category of a stipulation or match type. The match sim weights stats by it and wrestler specialties match against it. Missing means standard.

    Stipulation:
      type: object
      properties:
        stipulationId: { type: string }
        name: { type: string }
        description: { type: string }
        simCategory: { $ref: '#/components/schemas/SimCategory' }
        createdAt: { type: string }
        updatedAt: { type: string }

    MatchType:
      type: object
      properties:
        matchTypeId: { type: string }
        name: { type: string }
        description: { type: string }
        simCategory: { $ref: '#/components/schemas/SimCategory' }
        createdAt: { type: string }
        updatedAt: { type: string }

    LeagueEvent:
      type: object
      properties:
        eventId: { type: string }
        name: { type: string }
        eventType: { type: string, enum: [ppv, weekly, special, house] }
        date: { type: string }
        venue: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        themeColor: { type: string }
        status: { type: string, enum: [upcoming, in-progress, completed, cancelled] }
        seasonId: { type: string }
        matchCards: { type: array, items: { $ref: '#/components/schemas/MatchCardEntry' } }
        attendance: { type: integer }
        rating: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }

    MatchCardEntry:
      type: object
      properties:
        position: { type: integer }
        matchId: { type: string }
        designation: { type: string, enum: [pre-show, opener, midcard, co-main, main-event] }
        notes: { type: string }

    EventWithMatches:
      allOf:
        - { $ref: '#/components/schemas/LeagueEvent' }
        - type: object
          properties:
            enrichedMatches: { type: array }

    CreateEventInput:
      type: object
      required: [name, eventType, date]
      properties:
        name: { type: string }
        eventType: { type: string, enum: [ppv, weekly, special, house] }
        date: { type: string }
        venue: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        themeColor: { type: string }
        seasonId: { type: string }
    UpdateEventInput:
      type: object
      properties:
        eventId: { type: string }
        name: { type: string }
        eventType: { type: string }
        date: { type: string }
        status: { type: string }
        matchCards: { type: array, items: { $ref: '#/components/schemas/MatchCardEntry' } }
        attendance: { type: integer }
        rating: { type: number }
    Challenge:
      type: object
      properties:
        challengeId: { type: string }
        challengerId: { type: string }
        challengedId: { type: string }
        matchType: { type: string }
        stipulation: { type: string }
        championshipId: { type: string }
        message: { type: string }
        status: { type: string, enum: [pending, accepted, declined, countered, scheduled, expired, cancelled] }
        responseMessage: { type: string }
        counteredChallengeId: { type: string }
        matchId: { type: string }
        promoId: { type: string, description: The call-out promo this challenge came from }
        expiresAt: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    ChallengeWithPlayers:
      allOf:
        - { $ref: '#/components/schemas/Challenge' }
        - type: object
          properties:
            challenger: { $ref: '#/components/schemas/ChallengePlayerInfo' }
            challenged: { $ref: '#/components/schemas/ChallengePlayerInfo' }

    ChallengePlayerInfo:
      type: object
      properties:
        playerName: { type: string }
        wrestlerName: { type: string }
        imageUrl: { type: string }

    CreateChallengeInput:
      type: object
      required: [challengedId, matchType]
      properties:
        challengedId: { type: string }
        matchType: { type: string }
        stipulation: { type: string }
        championshipId: { type: string }
        message: { type: string }
        promoId: { type: string, description: The caller's own call-out promo to link this challenge to }

    RespondChallengeInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline, counter] }
        message: { type: string }
        matchType: { type: string }
        stipulation: { type: string }

    Promo:
      type: object
      properties:
        promoId: { type: string }
        playerId: { type: string }
        promoType: { type: string }
        title: { type: string }
        content: { type: string }
        targetPlayerId: { type: string }
        targetPromoId: { type: string }
        matchId: { type: string }
        championshipId: { type: string }
        imageUrl: { type: string }
        reactions: { type: object }
        reactionCounts: { type: object }
        isPinned: { type: boolean }
        isHidden: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    PromoWithContext:
      allOf:
        - { $ref: '#/components/schemas/Promo' }
        - type: object
          properties:
            playerName: { type: string }
            wrestlerName: { type: string }
            responseCount: { type: integer }

    CreatePromoInput:
      type: object
      required: [promoType, content]
      properties:
        promoType: { type: string }
        title: { type: string }
        content: { type: string }
        targetPlayerId: { type: string }
        targetPromoId: { type: string }
        matchId: { type: string }
        championshipId: { type: string }
        challengeMode: { type: string, enum: [singles, tag_team] }
        challengerTagTeamName: { type: string }
        targetTagTeamName: { type: string }
        targetTagTeamId: { type: string, description: 'The team a tag call-out names. Its members are checked before the promo is published. Not stored.' }

    ReactToPromoInput:
      type: object
      required: [reactionType]
      properties:
        reactionType: { type: string, enum: [fire, mic, trash, mind-blown, clap] }

    ChampionshipContenders:
      type: object
      properties:
        championshipId: { type: string }
        championshipName: { type: string }
        divisionId: { type: string, nullable: true }
        currentChampion:
          nullable: true
          description: 'Singles titles: a player object (`playerId`, `playerName`, `wrestlerName`, `imageUrl`). Tag titles: a TagTeamContenderChampion built from every holder.'
          oneOf:
            - type: object
              properties:
                playerId: { type: string }
                playerName: { type: string }
                wrestlerName: { type: string }
                imageUrl: { type: string, nullable: true }
            - $ref: '#/components/schemas/TagTeamContenderChampion'
        contenders:
          type: array
          description: 'Player rows have no `entityType`. Tag-team rows have `entityType: tagTeam`.'
          items:
            oneOf:
              - $ref: '#/components/schemas/PlayerContenderRow'
              - $ref: '#/components/schemas/TagTeamContenderRow'
        calculatedAt: { type: string, nullable: true }

    ContenderMember:
      type: object
      properties:
        playerId: { type: string }
        playerName: { type: string, description: 'Former member when the player row is gone.' }
        wrestlerName: { type: string }
        imageUrl: { type: string, nullable: true }

    PlayerContenderRow:
      type: object
      properties:
        rank: { type: integer }
        playerId: { type: string }
        playerName: { type: string }
        wrestlerName: { type: string }
        imageUrl: { type: string, nullable: true }
        rankingScore: { type: number }
        winPercentage: { type: number }
        currentStreak: { type: integer }
        matchesInPeriod: { type: integer }
        winsInPeriod: { type: integer }
        previousRank: { type: integer, nullable: true }
        movement: { type: integer }
        isNew: { type: boolean }
        isOverridden: { type: boolean }
        overrideType: { type: string, nullable: true, enum: [bump_to_top, send_to_bottom, null] }
        organicRank: { type: integer, nullable: true }

    TagTeamContenderRow:
      description: 'A ranked tag team. `playerId` equals `tagTeamId`. `playerName` (members joined with " & "), `wrestlerName` (team name) and `imageUrl` (team image) are display fallbacks for older clients.'
      allOf:
        - $ref: '#/components/schemas/PlayerContenderRow'
        - type: object
          properties:
            entityType: { type: string, enum: [tagTeam] }
            tagTeamId: { type: string }
            tagTeamName: { type: string }
            tagTeamImageUrl: { type: string, nullable: true }
            tagTeamStatus: { type: string, description: 'Status today. A dissolved team can still have a stored row.' }
            members:
              type: array
              minItems: 2
              maxItems: 2
              items: { $ref: '#/components/schemas/ContenderMember' }

    TagTeamContenderChampion:
      type: object
      description: 'Tag title holders. Team fields are null when the holders are not a known tag team.'
      properties:
        type: { type: string, enum: [tagTeam] }
        tagTeamId: { type: string, nullable: true }
        tagTeamName: { type: string, nullable: true }
        tagTeamImageUrl: { type: string, nullable: true }
        members: { type: array, items: { $ref: '#/components/schemas/ContenderMember' } }
        playerName: { type: string, description: 'Display fallback: member player names joined with " & ".' }
        wrestlerName: { type: string, description: 'Display fallback: team name, or member wrestler names joined with " & ".' }
        imageUrl: { type: string, nullable: true, description: 'Display fallback: the team image.' }

    SiteFeatures:
      type: object
      properties:
        challenges: { type: boolean }
        promos: { type: boolean }
        contenders: { type: boolean }
        statistics: { type: boolean }
        stables: { type: boolean }
        rivalries: { type: boolean }
        notifications: { type: boolean }
        transfers: { type: boolean }
        ticker: { type: boolean, description: 'League ticker. Off removes it everywhere and GET /ticker returns no segments.' }
        economy: { type: boolean, description: 'Contracts, wallets, fines and the shop. Off by default.' }

    TickerSettings:
      type: object
      properties:
        enabledSegments:
          type: array
          description: Segment keys GET /ticker may return. Defaults to every key.
          items:
            type: string
            enum: [pinned, tonight, newChampions, potentialCallups, promotionWatch, hotRivalries, custom, news, upcomingShows, champions, latestResults]
        scrollSpeed: { type: string, enum: [slow, normal, fast], description: 'Defaults to normal.' }
        publicRelegationWatch: { type: boolean, description: 'Show relegation watch and zones to everyone. Defaults to false (GMs only).' }

    SiteConfigResponse:
      type: object
      properties:
        features: { $ref: '#/components/schemas/SiteFeatures' }
        ticker: { $ref: '#/components/schemas/TickerSettings' }

    ContractPayTerms:
      type: object
      required: [perMatchPay, weeklySalary, winBonus]
      properties:
        perMatchPay: { type: integer, minimum: 0 }
        weeklySalary: { type: integer, minimum: 0 }
        winBonus: { type: integer, minimum: 0 }

    FinePreset:
      type: object
      required: [key, label, amount]
      properties:
        key: { type: string, description: 'Unique among the presets.' }
        label: { type: string }
        amount: { type: integer, minimum: 0 }

    EconomyShopSettings:
      type: object
      properties:
        injuryShield:
          type: object
          properties:
            enabled: { type: boolean }
            price: { type: integer, minimum: 0 }
            chanceReduction: { type: number, minimum: 0, maximum: 1, description: 'Fraction taken off the injury chance.' }
            matches: { type: integer, minimum: 1 }
        rehab:
          type: object
          properties:
            enabled: { type: boolean }
            price: { type: integer, minimum: 0 }
            weeksOff: { type: integer, minimum: 1 }
        staminaTopUp:
          type: object
          properties:
            enabled: { type: boolean }
            price: { type: integer, minimum: 0 }
            amount: { type: integer, minimum: 0 }
        simInterference:
          type: object
          properties:
            enabled: { type: boolean }
            price: { type: integer, minimum: 0 }
            ratingBoost: { type: integer, minimum: 0 }
        gmInterference:
          type: object
          properties:
            enabled: { type: boolean }
            price: { type: integer, minimum: 0 }

    EconomySettings:
      type: object
      description: League economy settings. Amounts are whole numbers of the league currency (max 1000000).
      properties:
        currencyName: { type: string, example: League Dollars }
        currencySymbol: { type: string, example: $ }
        contractDefaults:
          type: object
          description: Pay terms each contract offer starts from. GMs can override each offer.
          properties:
            tryout:
              allOf:
                - $ref: '#/components/schemas/ContractPayTerms'
                - type: object
                  properties:
                    matches: { type: integer, minimum: 1 }
            matches: { $ref: '#/components/schemas/ContractPayTerms' }
            season: { $ref: '#/components/schemas/ContractPayTerms' }
        freeAgentWinBonus: { type: integer, minimum: 0 }
        offerExpiryDays: { type: integer, minimum: 1 }
        noShowFine: { type: integer, minimum: 0 }
        finePresets: { type: array, items: { $ref: '#/components/schemas/FinePreset' } }
        shop: { $ref: '#/components/schemas/EconomyShopSettings' }
        version: { type: integer, description: '0 until first saved; each save adds 1. The last 20 versions are kept.' }
        updatedAt: { type: string, format: date-time, nullable: true }
        updatedBy: { type: string, nullable: true }

    UpdateEconomySettingsInput:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          description: >-
            A full or partial EconomySettings (without version, updatedAt, updatedBy). Nested objects
            merge into the current settings; finePresets replaces the list. The merged result is validated.
        expectedVersion:
          type: integer
          minimum: 0
          description: The version the edit was based on. A save over a newer version returns 409.

    EconomyCatalog:
      type: object
      properties:
        currencyName: { type: string }
        currencySymbol: { type: string }
        version: { type: integer }
        items:
          type: array
          description: Enabled shop items only, in a fixed order.
          items:
            type: object
            properties:
              key: { type: string, enum: [injuryShield, rehab, staminaTopUp, simInterference, gmInterference] }
              enabled: { type: boolean }
              price: { type: integer }
              chanceReduction: { type: number }
              matches: { type: integer }
              weeksOff: { type: integer }
              amount: { type: integer }
              ratingBoost: { type: integer }

    # ECO-08
    PlayerEffect:
      type: object
      description: >-
        A bought shop effect waiting to be used (applied by the injury and sim
        code). injuryShield has reduction + matchesLeft; rehab has weeksOff;
        staminaTopUp has amount.
      required: [effectId, kind, purchasedAt, purchaseKey]
      properties:
        effectId: { type: string }
        kind: { type: string, enum: [injuryShield, rehab, staminaTopUp] }
        purchasedAt: { type: string, format: date-time }
        purchaseKey: { type: string, description: Idempotency key of the purchase ledger entry }
        reduction: { type: number, description: 'injuryShield: fraction taken off the injury chance' }
        matchesLeft: { type: integer, description: 'injuryShield: matches still covered' }
        weeksOff: { type: integer, description: 'rehab: weeks to take off the active injury' }
        amount: { type: integer, description: 'staminaTopUp: stamina to add' }
    SimBoost:
      type: object
      required: [playerId, boost, purchasedAt, purchaseKey]
      properties:
        playerId: { type: string }
        boost: { type: number }
        purchasedAt: { type: string, format: date-time }
        purchaseKey: { type: string }
    ShopPurchaseInput:
      type: object
      required: [item]
      properties:
        item: { type: string, enum: [injuryShield, rehab, staminaTopUp, simInterference] }
        target: { type: string, description: 'simInterference only: the matchId' }
        requestId: { type: string, maxLength: 100, description: 'Optional; resending the same id never charges twice (not used for simInterference, which allows one per match)' }
    ShopPurchaseResult:
      type: object
      required: [item, entry, balance, alreadyApplied]
      properties:
        item: { type: string }
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        balance: { type: integer }
        effect: { $ref: '#/components/schemas/PlayerEffect' }
        simBoost:
          allOf:
            - { $ref: '#/components/schemas/SimBoost' }
            - type: object
              properties:
                matchId: { type: string }
        alreadyApplied: { type: boolean }

    # ECO-09
    GmInterferenceInput:
      type: object
      required: [request]
      properties:
        request: { type: string, minLength: 1, maxLength: 500, description: 'What the player asks the GM for (trimmed)' }
        matchId: { type: string, description: 'Optional scheduled match the request is about' }
    PlayerGmInterference:
      type: object
      description: The player's view of their own request. No private note, no GM id.
      required: [requestId, request, status, price, createdAt]
      properties:
        requestId: { type: string }
        request: { type: string }
        matchId: { type: string }
        status: { type: string, enum: [pending, delivered, partial, taken, refunded] }
        price: { type: integer }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        publicNote: { type: string }
        outcomeMessage: { type: string, description: 'Outcome line once resolved, e.g. "The GM took your money. Better luck next time."' }
    GmInterferenceRequest:
      type: object
      description: Staff view of a request.
      required: [requestId, playerId, request, status, price, sequence, chargeEntryId, chargeKey, createdAt, updatedAt]
      properties:
        requestId: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        request: { type: string }
        matchId: { type: string }
        status: { type: string, enum: [pending, delivered, partial, taken, refunded] }
        price: { type: integer }
        sequence: { type: integer, description: "1-based count of the player's requests" }
        chargeEntryId: { type: string }
        chargeKey: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string, description: 'Cognito sub of the GM' }
        publicNote: { type: string }
        privateNote: { type: string }
        refundEntryId: { type: string }
    GmInterferenceRequestResult:
      type: object
      required: [request, entry, balance]
      properties:
        request: { $ref: '#/components/schemas/PlayerGmInterference' }
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        balance: { type: integer }
    ResolveGmInterferenceInput:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [delivered, partial, taken, refunded], description: 'Only refunded gives the money back' }
        publicNote: { type: string, maxLength: 1000, description: 'Shown to the player' }
        privateNote: { type: string, maxLength: 1000, description: 'Staff only' }
    ResolveGmInterferenceResult:
      type: object
      required: [request]
      properties:
        request: { $ref: '#/components/schemas/GmInterferenceRequest' }
        refund: { $ref: '#/components/schemas/LedgerEntry' }

    UpdateSiteConfigInput:
      type: object
      description: At least one of features or ticker. Both are partial patches.
      properties:
        features: { $ref: '#/components/schemas/SiteFeatures' }
        ticker: { $ref: '#/components/schemas/TickerSettings' }

    UserListItem:
      type: object
      properties:
        userId: { type: string }
        email: { type: string }
        username: { type: string }
        roles: { type: array, items: { type: string } }
        enabled: { type: boolean }

    UpdateRoleInput:
      type: object
      required: [userId, role]
      properties:
        userId: { type: string }
        role: { type: string }

    ToggleEnabledInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

    AuthSetupInput:
      type: object
      properties:
        adminSetupKey: { type: string }
        email: { type: string }
        password: { type: string }
        username: { type: string }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT access token for API authorization' }
        idToken: { type: string, description: 'JWT ID token with user claims' }
        refreshToken: { type: string, description: 'Token to refresh the session' }
        expiresIn: { type: integer, description: 'Token lifetime in seconds' }
        tokenType: { type: string, example: 'Bearer' }

    GenerateUploadUrlResponse:
      type: object
      properties:
        uploadUrl: { type: string }
        imageUrl: { type: string }

    BulkDeleteChallengesInput:
      type: object
      properties:
        challengeIds: { type: array, items: { type: string } }

    BulkDeletePromosInput:
      type: object
      properties:
        promoIds: { type: array, items: { type: string } }

    PlayerStatistics:
      type: object
      properties:
        playerId: { type: string }
        statType: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        matchesPlayed: { type: integer }
        winPercentage: { type: number }
        currentWinStreak: { type: integer }
        longestWinStreak: { type: integer }
        championshipWins: { type: integer }
        championshipLosses: { type: integer }
        updatedAt: { type: string }

    HeadToHead:
      type: object
      properties:
        matchupKey: { type: string }
        player1Id: { type: string }
        player2Id: { type: string }
        player1Wins: { type: integer }
        player2Wins: { type: integer }
        draws: { type: integer }
        totalMatches: { type: integer }
        recentResults: { type: array }
        updatedAt: { type: string }

    LeaderboardEntry:
      type: object
      properties:
        playerId: { type: string }
        playerName: { type: string }
        wrestlerName: { type: string }
        value: { type: number }
        rank: { type: integer }

    RecordEntry:
      type: object
      properties:
        recordName: { type: string }
        holderName: { type: string }
        wrestlerName: { type: string }
        value: { oneOf: [{ type: number }, { type: string }] }
        date: { type: string }
        description: { type: string }

    Achievement:
      type: object
      properties:
        playerId: { type: string }
        achievementId: { type: string }
        achievementName: { type: string }
        achievementType: { type: string }
        description: { type: string }
        earnedAt: { type: string }
        icon: { type: string }

    StatisticsResponse:
      type: object
      description: Response shape varies by query param section (overall, headToHead, leaderboards, records, achievements, etc.)
      additionalProperties: true

    Company:
      type: object
      properties:
        companyId: { type: string }
        name: { type: string }
        abbreviation: { type: string }
        imageUrl: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Show:
      type: object
      properties:
        showId: { type: string }
        name: { type: string }
        companyId: { type: string }
        description: { type: string }
        schedule: { type: string }
        dayOfWeek: { type: string }
        ppvDate: { type: string }
        imageUrl: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Location:
      type: object
      properties:
        locationId: { type: string }
        name: { type: string }
        city: { type: string }
        state: { type: string }
        country: { type: string }
        capacity: { type: integer }
        latitude: { type: number }
        longitude: { type: number }
        imageUrl: { type: string }
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Wrestler:
      type: object
      properties:
        wrestlerId: { type: string }
        promotion: { type: string, enum: [AAA, AEW, NJPW, ROH, TNA, WCW, WWE, OTHER] }
        name: { type: string }
        overallCap: { type: integer, minimum: 70, maximum: 93 }
        isInUse: { type: boolean }
        assignedPlayerId: { type: string }
        assignedSlot: { type: string, enum: [primary, alternate] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Stable:
      type: object
      properties:
        stableId: { type: string }
        name: { type: string }
        leaderId: { type: string }
        memberIds: { type: array, items: { type: string } }
        imageUrl: { type: string }
        status: { type: string, enum: [pending, approved, active, disbanded] }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        disbandedAt: { type: string, format: date-time }

    StableInvitation:
      type: object
      properties:
        invitationId: { type: string }
        stableId: { type: string }
        invitedPlayerId: { type: string }
        invitedByPlayerId: { type: string }
        status: { type: string, enum: [pending, accepted, declined, expired] }
        message: { type: string }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TagTeam:
      type: object
      properties:
        tagTeamId: { type: string }
        name: { type: string }
        player1Id: { type: string }
        player2Id: { type: string }
        imageUrl: { type: string }
        status: { type: string, enum: [pending_partner, pending_admin, active, dissolved] }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dissolvedAt: { type: string, format: date-time }
        player1WrestlerName: { type: string }
        player2WrestlerName: { type: string }
        rejectionReason: { type: string, description: Why a pending request was closed without becoming active }

    Video:
      type: object
      properties:
        videoId: { type: string }
        title: { type: string }
        description: { type: string }
        videoUrl: { type: string }
        thumbnailUrl: { type: string }
        category: { type: string, enum: [match, highlight, promo, other] }
        tags: { type: array, items: { type: string } }
        isPublished: { type: boolean }
        uploadedBy: { type: string }
        createdAt: { type: string, format: date-time }

    Announcement:
      type: object
      properties:
        announcementId: { type: string }
        title: { type: string }
        body: { type: string }
        priority: { type: integer }
        isActive: { type: boolean }
        expiresAt: { type: string, format: date-time }
        videoUrl: { type: string }
        showAsPopup: { type: boolean, description: 'Also show as a pop-up. Every announcement appears on News; missing means News only.' }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Notification:
      type: object
      properties:
        notificationId: { type: string }
        userId: { type: string }
        type: { type: string }
        message: { type: string }
        sourceId: { type: string }
        sourceType: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }

    TransferRequest:
      type: object
      properties:
        requestId: { type: string }
        playerId: { type: string }
        fromDivisionId: { type: string }
        toDivisionId: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewNote: { type: string }
        reviewedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StorylineRequest:
      type: object
      properties:
        requestId: { type: string }
        requesterId: { type: string }
        targetPlayerIds: { type: array, items: { type: string } }
        requestType: { type: string, enum: [storyline, backstage_attack, rivalry] }
        description: { type: string }
        status: { type: string, enum: [pending, acknowledged, declined] }
        gmNote: { type: string }
        reviewedBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OverallSubmission:
      type: object
      properties:
        playerId: { type: string }
        mainOverall: { type: integer, minimum: 60, maximum: 99 }
        alternateOverall: { type: integer, minimum: 60, maximum: 99 }
        submittedAt: { type: string, format: date-time }

    SeasonAward:
      type: object
      properties:
        awardId: { type: string }
        seasonId: { type: string }
        name: { type: string }
        awardType: { type: string }
        playerId: { type: string }
        playerName: { type: string }
        description: { type: string }
        value: { type: string }
        autoGenerated: { type: boolean }
        createdAt: { type: string, format: date-time }

    ContenderOverride:
      type: object
      properties:
        championshipId: { type: string }
        playerId:
          type: string
          description: The overridden entity's id. On a tag title (entityType tagTeam) this is the tagTeamId.
        entityType:
          type: string
          enum: [player, tagTeam]
          description: tagTeam on tag-title overrides. Overrides stored before tag overrides read as player.
        tagTeamId: { type: string, description: 'Tag overrides only, equal to playerId.' }
        overrideType: { type: string, enum: [bump_to_top, send_to_bottom] }
        reason: { type: string }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        active: { type: boolean }
        playerName: { type: string, description: "On a tag override, the members' names joined with ' & '." }
        wrestlerName: { type: string, description: 'On a tag override, the team name.' }
        playerImageUrl: { type: string, description: 'On a tag override, the team image.' }
        tagTeamName: { type: string, description: 'Tag overrides only.' }
        members:
          type: array
          description: Tag overrides only.
          items:
            type: object
            properties:
              playerId: { type: string }
              playerName: { type: string }
        currentRank: { type: integer, nullable: true }

    DeleteUserInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

    BulkUsersInput:
      type: object
      required: [action, usernames]
      properties:
        action: { type: string, enum: [enable, disable, addRole, removeRole, delete] }
        role: { type: string, enum: [Wrestler, Moderator], description: 'Required for addRole and removeRole' }
        usernames: { type: array, minItems: 1, maxItems: 50, items: { type: string } }

    BulkUsersResult:
      type: object
      properties:
        action: { type: string }
        role: { type: string }
        succeeded: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              username: { type: string }
              ok: { type: boolean }
              code: { type: string, description: 'Set when ok is false, e.g. USER_ENABLED, PLAYER_DEACTIVATED, DISCIPLINE_ACTIVE, SELF, ERROR' }
              message: { type: string }

    ProgressionGoal:
      type: object
      required: [metric, threshold]
      properties:
        goalId: { type: string, description: Generated when omitted on create. }
        metric:
          type: string
          enum: [matchesCompeted, wins, winPct, avgStarRating, promosCut, promosWithReactions, totalPromoReactions, matchOfTheNight, challengesIssued, currentWinStreak, lossPct, currentLossStreak, daysSinceLastMatch, avgStarRatingBelow, contenderRankBest, losses, currentWinlessStreak]
          description: >-
            lossPct, currentLossStreak, losses and currentWinlessStreak skip losses in hot-angle matches
            (linked to an active rivalry at hot heat or above): they neither count nor break a streak.
            currentWinlessStreak counts losses and draws from the newest match back until a win. daysSinceLastMatch counts whole days since the latest match.
            avgStarRatingBelow is 5 minus the average star rating. contenderRankBest is the best
            contender rank on the titles of the player's division (lower is better; use direction atMost).
        threshold: { type: number, description: Must be greater than 0. }
        weight: { type: number, default: 1, description: Must be greater than 0. Weights are normalised by their total. }
        direction: { type: string, enum: [atLeast, atMost], default: atLeast }
        params:
          type: object
          properties:
            minRatedMatches: { type: integer, minimum: 1, description: avgStarRating only. }
            minReactions: { type: integer, minimum: 1, description: promosWithReactions only. }
            lastMatches: { type: integer, minimum: 1, description: 'winPct and lossPct only: measure over the most recent N matches; no value until N exist.' }
        labelKey: { type: string }

    ProgressionTrack:
      type: object
      properties:
        trackId: { type: string }
        kind: { type: string, enum: [callup, promotion, relegation] }
        name: { type: string }
        fromDivisionId: { type: string }
        toDivisionId: { type: string }
        goals: { type: array, items: { $ref: '#/components/schemas/ProgressionGoal' } }
        windowMode: { type: string, enum: [allTime, season, sinceJoinedDivision] }
        isActive: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    ProgressionTrackInput:
      type: object
      description: >-
        On POST, kind, name, fromDivisionId and goals are required; windowMode defaults to
        sinceJoinedDivision and isActive to true. On PUT every field is optional, goals replaces
        the whole list, and toDivisionId null clears the destination. Only one active track may
        exist per (kind, fromDivisionId). An active promotion or relegation track needs a tiered
        main-roster fromDivisionId; a promotion toDivisionId must rank above it and a relegation
        toDivisionId below it. Left unset, the destination is resolved at execution, and a division
        must exist on that side of the ladder.
      properties:
        kind: { type: string, enum: [callup, promotion, relegation] }
        name: { type: string, maxLength: 100 }
        fromDivisionId: { type: string }
        toDivisionId: { type: string, nullable: true }
        goals: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/ProgressionGoal' } }
        windowMode: { type: string, enum: [allTime, season, sinceJoinedDivision] }
        isActive: { type: boolean }

    ProgressionGoalDetail:
      type: object
      properties:
        goalId: { type: string }
        metric: { type: string }
        threshold: { type: number }
        weight: { type: number }
        direction: { type: string, enum: [atLeast, atMost] }
        params: { type: object }
        labelKey: { type: string }
        current: { type: number, nullable: true, description: null while the metric is not yet computable. }
        met: { type: boolean }

    ProgressionConsideration:
      type: object
      properties:
        status: { type: string, enum: [considering] }
        markedBy: { type: string }
        markedAt: { type: string }
        note: { type: string }

    PlayerProgressionSummary:
      type: object
      properties:
        trackId: { type: string }
        kind: { type: string, enum: [callup, promotion, relegation] }
        trackName: { type: string }
        progressPct: { type: number, description: 0-100 }
        consideration: { type: boolean }
        computedAt: { type: string }
        goals:
          type: array
          description: Only for the player themselves and Moderator+.
          items: { $ref: '#/components/schemas/ProgressionGoalDetail' }
        considerationDetail:
          allOf: [{ $ref: '#/components/schemas/ProgressionConsideration' }]
          description: Who marked the player, and the GM note. Moderator+ only.
        countingSince:
          type: string
          format: date-time
          description: >-
            Start of the track's counting window: the player's progression epoch (last
            division move or goal reset), or the season start for a season track when that
            is later. Absent for a season track when no season is active.
        countingSinceReason:
          type: object
          description: >-
            Why the count restarted at countingSince. Only for the player themselves, and only
            when a promotion, call-up, division move or goal reset is recorded at that instant.
            Relegations and transfers read as divisionChange.
          required: [type]
          properties:
            type: { type: string, enum: [callup, promotion, divisionChange, goalsReset] }
            divisionName:
              type: string
              nullable: true
              description: The division moved to. Absent for goalsReset; null when the division was deleted.

paths:
  /auth/setup:
    post:
      tags: [Auth]
      summary: Create initial admin user
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupInput' }
      responses:
        '201': { description: Admin created }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      description: Authenticates against AWS Cognito and returns JWT tokens. Use the accessToken in the Authorization header as "Bearer {accessToken}" to call protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Invalid credentials', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/users:
    get:
      tags: [Users]
      summary: List users (admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: List of users }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/users/role:
    post:
      tags: [Users]
      summary: Update user role
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleInput' }
      responses:
        '200': { description: Role updated }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/users/toggle-enabled:
    post:
      tags: [Users]
      summary: Toggle user enabled
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ToggleEnabledInput' }
      responses:
        '200': { description: Toggled }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /site-config:
    get:
      tags: [Site Config]
      summary: Get site config (feature flags and ticker settings)
      responses:
        '200':
          description: Site config
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfigResponse' }
        '500': { description: 'Server error', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/site-config:
    put:
      tags: [Site Config]
      summary: Update site config (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSiteConfigInput' }
      responses:
        '200':
          description: The full site config after the update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteConfigResponse' }
        '400': { description: 'Invalid feature key or ticker setting', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/economy-config:
    get:
      tags: [Site Config]
      summary: Get the economy settings (Moderator, Admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: Current settings, merged over the defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/EconomySettings' }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [Site Config]
      summary: Save the economy settings as a new version (Admin)
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEconomySettingsInput' }
      responses:
        '200':
          description: The saved settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: '#/components/schemas/EconomySettings' }
        '400': { description: 'Invalid settings: negative or fractional amount, duplicate preset key, shield reduction outside [0, 1], unknown key', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'expectedVersion is stale, or another save won the race', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /economy/catalog:
    get:
      tags: [Site Config]
      summary: Shop catalog (enabled items and prices)
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EconomyCatalog' }
        '500': { description: 'Server error', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ECO-08
  /shop/purchase:
    post:
      tags: [Site Config]
      summary: Buy a shop item for yourself
      description: >-
        Wrestler (the caller's own player). Needs the economy feature. Charges
        the price as a `purchase` ledger entry and stores the effect in the same
        transaction: injuryShield, rehab and staminaTopUp go on the player's
        `effects`; simInterference goes on the match's `simBoosts` (a scheduled
        match the buyer is in, one per player). A boost is refunded when the
        result is recorded by hand or the scheduled match is deleted. Refusals
        are 409 with a `code`: ITEM_DISABLED, IN_DEBT, INSUFFICIENT_FUNDS,
        SHIELD_ACTIVE, NO_ACTIVE_INJURY, INJURY_TOO_SHORT, MATCH_NOT_SCHEDULED,
        NOT_IN_MATCH, BOOST_ALREADY_BOUGHT. GM interference is not sold here.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopPurchaseInput' }
      responses:
        '201':
          description: Bought
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopPurchaseResult' }
        '200':
          description: This requestId was already bought; nothing new was charged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopPurchaseResult' }
        '400': { description: 'Unknown item, missing or unexpected target, bad requestId', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Not a Wrestler, or the economy feature is off', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'No player profile for the caller, or the match does not exist', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Refused (see `code`), or the balance or match changed while buying', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ECO-09
  /shop/gm-interference:
    post:
      tags: [Site Config]
      summary: Pay for GM interference
      description: >-
        Wrestler (the caller's own player). Needs the economy feature. Charges
        `shop.gmInterference.price` up front as a `purchase` ledger entry and
        creates a pending request in the same transaction, then notifies every
        GM. The GM may deliver all, some or nothing and keeps the money unless
        they refund it. One pending request per player. Refusals are 409 with a
        `code`: ITEM_DISABLED, IN_DEBT, INSUFFICIENT_FUNDS, REQUEST_PENDING,
        MATCH_NOT_SCHEDULED.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GmInterferenceInput' }
      responses:
        '201':
          description: Paid; the request is pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GmInterferenceRequestResult' }
        '400': { description: 'Missing or too long request, bad matchId', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Not a Wrestler, or the economy feature is off', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'No player profile for the caller, or the match does not exist', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Refused (see `code`), or the balance changed while paying', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      tags: [Site Config]
      summary: My GM interference requests
      description: Wrestler (the caller's own player). Newest first, with the outcome and public note only.
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: The caller's requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/PlayerGmInterference' } }
        '403': { description: 'Not a Wrestler', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'No player profile for the caller', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gm-interference:
    get:
      tags: [Site Config]
      summary: GM interference queue
      description: Admin and Moderator. Every request, or one status, newest first, with player names and private notes.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [pending, delivered, partial, taken, refunded] }
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests: { type: array, items: { $ref: '#/components/schemas/GmInterferenceRequest' } }
        '400': { description: 'Unknown status', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Not staff', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /gm-interference/{requestId}/resolve:
    post:
      tags: [Site Config]
      summary: Resolve a GM interference request
      description: >-
        Admin and Moderator. `refunded` posts a `refund` of the price in the
        same transaction; delivered, partial and taken keep the money. A
        request resolves once. A GM cannot resolve their own request
        (409 OWN_REQUEST). The player is notified with the outcome and the
        public note; the private note stays with staff.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolveGmInterferenceInput' }
      responses:
        '200':
          description: Resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolveGmInterferenceResult' }
        '400': { description: 'Bad outcome or note too long', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Not staff', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Request (or its player) not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'ALREADY_RESOLVED, OWN_REQUEST, or the balance changed while refunding', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

