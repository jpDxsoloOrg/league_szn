                type: array
                items: { $ref: '#/components/schemas/ContenderOverride' }
    post:
      tags: [Contenders]
      summary: Set contender override
      description: >-
        Saves the override, recalculates the title and reports where the player or team ended up.
        A singles title takes playerId and refuses tagTeamId. A tag title ranks tag teams, so it takes
        tagTeamId (an active team whose members are live, visible, in the title's division and not the
        current champions) and refuses playerId with 400. Tag overrides are stored with entityType
        tagTeam and the tagTeamId in playerId.
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [championshipId, overrideType, reason]
              properties:
                championshipId: { type: string }
                playerId: { type: string, description: 'Singles titles only (required there).' }
                tagTeamId: { type: string, description: 'Tag titles only (required there).' }
                overrideType: { type: string, enum: [bump_to_top, send_to_bottom] }
                reason: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        '201':
          description: Override created. placement.status is onList, notOnList, noActiveSeason or recalculationFailed, and placement.rank is set for onList.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ContenderOverride'
                  - type: object
                    properties:
                      placement:
                        type: object
                        properties:
                          status: { type: string, enum: [onList, notOnList, noActiveSeason, recalculationFailed] }
                          rank: { type: integer, nullable: true }
        '400': { description: 'Bad request, including playerId on a tag title, tagTeamId on a singles title, or an unknown or inactive tag team', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/contenders/overrides/{championshipId}/{playerId}:
    delete:
      tags: [Contenders]
      summary: Remove contender override
      security: [{ BearerAuth: [] }]
      parameters:
        - name: championshipId
          in: path
          required: true
          schema: { type: string }
        - name: playerId
          in: path
          required: true
          description: The overridden entity's id. On a tag title, the tagTeamId.
          schema: { type: string }
      responses:
        '200': { description: 'Override removed. The body echoes championshipId, playerId and entityType (plus tagTeamId on a tag override).' }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

