        '200': { description: All player overall submissions with names }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/players/{playerId}:
    get:
      tags: [Progression]
      summary: A player's progress on every active track
      description: >-
        Public. Anonymous callers and other wrestlers get the summary. The player themselves
        also gets goal detail; Moderator+ also gets considerationDetail (the GM note). Send a
        Bearer token to be identified. Hidden players return 404 except to themselves and staff.
        Relegation rows are left out for everyone but the player and Moderator+, and the player
        sees `consideration: false` on them, unless the publicRelegationWatch ticker setting is on.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One row per active track the player has been scored on
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PlayerProgressionSummary' } }
        '404': { description: 'Player not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/players/{playerId}/history:
    get:
      tags: [Progression]
      summary: A player's division history
      description: >-
        Public (DMV-09). Executed call-ups, promotions and relegations merged with approved
        division transfers, oldest first. A transfer's `movedAt` is its review time. Division
        names are null when the division has since been deleted. Hidden players return 404
        except to themselves and staff.
      parameters:
        - { name: playerId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Division moves, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, kind, fromDivisionId, fromDivisionName, toDivisionId, toDivisionName, movedAt]
                  properties:
                    id: { type: string, description: 'Progression eventId or transfer requestId' }
                    kind: { type: string, enum: [callup, promotion, relegation, transfer] }
                    fromDivisionId: { type: string }
                    fromDivisionName: { type: string, nullable: true }
                    toDivisionId: { type: string }
                    toDivisionName: { type: string, nullable: true }
                    movedAt: { type: string, format: date-time }
        '404': { description: 'Player not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/tracks:
    get:
      tags: [Progression]
      summary: List progression tracks
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [callup, promotion, relegation] } }
        - { name: isActive, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: fromDivisionId, in: query, schema: { type: string } }
      responses:
        '200':
          description: Tracks sorted by name
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ProgressionTrack' } }
        '400': { description: 'Bad query parameter', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      tags: [Progression]
      summary: Create a progression track (Moderator+)
      description: Queues an async recompute of every player in fromDivisionId.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressionTrackInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressionTrack' }
        '400': { description: 'Invalid track or unknown division', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Another active track already has this kind and fromDivisionId', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/tracks/{trackId}:
    put:
      tags: [Progression]
      summary: Update a progression track (Moderator+)
      description: Partial update. Queues an async recompute of every player in the old and new fromDivisionId.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressionTrackInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressionTrack' }
        '400': { description: 'Invalid track or unknown division', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Track not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Another active track already has this kind and fromDivisionId', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/tracks/{trackId}/players:
    get:
      tags: [Progression]
      summary: Candidate board for a track (Moderator+)
      description: Players still in the track's fromDivisionId, highest progressPct first.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: trackId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        '200':
          description: The track and its candidates
          content:
            application/json:
              schema:
                type: object
                properties:
                  track: { $ref: '#/components/schemas/ProgressionTrack' }
                  players:
                    type: array
                    items:
                      type: object
                      properties:
                        playerId: { type: string }
                        name: { type: string }
                        wrestlerName: { type: string }
                        imageUrl: { type: string }
                        progressPct: { type: number }
                        goals: { type: array, items: { $ref: '#/components/schemas/ProgressionGoalDetail' } }
                        consideration: { $ref: '#/components/schemas/ProgressionConsideration' }
                        computedAt: { type: string }
                        lastMatchDate: { type: string, format: date-time, description: "Date of the player's latest completed match; absent when they have none" }
        '400': { description: 'Bad limit', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Track not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ── Progression: call-up history (CUP-09) ────────────────────────────

  /progression/events:
    get:
      tags: [Progression]
      summary: Call-up history (Moderator+)
      description: >
        ProgressionEvents (consideration added or removed, executed moves, GM goal
        resets) across every
        player, newest first, joined with player, track and division names. `actorName`
        is the linked player name of the staff member who acted; it is null for
        system actions (`actorUserId: system`) and for staff with no linked player.
        Scans the events table, so results are capped by `limit`.
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: trackId, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [callup, promotion, relegation] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [eventId, type, kind, trackId, playerId, fromDivisionId, actorUserId, createdAt]
                  properties:
                    eventId: { type: string }
                    type: { type: string, enum: [consideration_added, consideration_removed, executed, goals_reset] }
                    kind: { type: string, enum: [callup, promotion, relegation] }
                    trackId: { type: string }
                    trackName: { type: string, nullable: true }
                    playerId: { type: string }
                    playerName: { type: string, nullable: true }
                    wrestlerName: { type: string, nullable: true }
                    fromDivisionId: { type: string }
                    fromDivisionName: { type: string, nullable: true }
                    toDivisionId: { type: string }
                    toDivisionName: { type: string, nullable: true }
                    actorUserId: { type: string, description: "Cognito sub, or 'system'" }
                    actorName: { type: string, nullable: true }
                    createdAt: { type: string, format: date-time }
                    note: { type: string, description: "The GM's note on a goals_reset event" }
        '400': { description: 'Bad limit or kind', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  # ── Progression: call-up considerations (CUP-05) ─────────────────────

  /progression/players/{playerId}/consideration:
    put:
      tags: [Progression]
      summary: Mark or unmark a player as being considered (Admin, Moderator)
      description: >
        Writes the consideration on the player's progression row for the track and
        appends a ProgressionEvent in one transaction. Requesting the stored state is a
        no-op (`changed: false`, no event, no notification). A mark creates the row,
        scored from current data, if no recompute has run yet. Marking needs an active
        track and a player in its from-division. The wrestler is notified on a
        call-up or promotion mark only ("You're on the GMs' promotion watch!"), never on removal.
        A relegation mark sends no notification; it is logged as a ProgressionEvent for GMs.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: playerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId, considering]
              properties:
                trackId: { type: string }
                considering: { type: boolean }
                note: { type: string, maxLength: 500, description: 'Staff-only note; never shown publicly' }
      responses:
        '200':
          description: Current consideration state
          content:
            application/json:
              schema:
                type: object
                properties:
                  playerId: { type: string }
                  trackId: { type: string }
                  considering: { type: boolean }
                  changed: { type: boolean, description: 'False when the request matched the stored state' }
                  consideration:
                    nullable: true
                    type: object
                    properties:
                      status: { type: string, enum: [considering] }
                      markedBy: { type: string }
                      markedAt: { type: string, format: date-time }
                      note: { type: string }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Track or player not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Changed by another request; retry', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/considerations:
    get:
      tags: [Progression]
      summary: List players currently being considered (public)
      description: >
        One entry per player on an active track of `kind`, newest mark first. Deleted,
        deactivated and wrestler-less players are left out. Backed by an eventually
        consistent index, so a new mark can take a moment to appear.
        `kind=relegation` (relegation watch) is Moderator+ only unless the
        `publicRelegationWatch` ticker setting is on; send a bearer token to read it.
      parameters:
        - name: kind
          in: query
          schema: { type: string, enum: [callup, promotion, relegation], default: callup }
      responses:
        '200':
          description: Current considerations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    playerId: { type: string }
                    name: { type: string }
                    wrestlerName: { type: string }
                    trackId: { type: string }
                    markedAt: { type: string, format: date-time }
        '400': { description: 'Unknown kind', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'kind=relegation from a caller below Moderator while publicRelegationWatch is off', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/reviews/{seasonId}:
    get:
      tags: [Progression]
      summary: End-of-season movement review (Moderator+)
      description: >-
        The snapshot taken when the season was completed (DMV-03): one row per
        player in a division with an active promotion or relegation track. Each
        row has the player's best promotion and relegation progress, their rank
        in the division's season standings, whether a GM flagged them (under
        consideration), the recommendation and any decision already applied.
        Recommendation: promote at 100% promotion progress or for the top of
        the division's season standings; relegate at 100% relegation progress
        (losses in hot or scorching rivalries never count); otherwise stay.
        `targets` previews where a promote / relegate would go.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: seasonId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The season's reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  seasonId: { type: string }
                  seasonStatus: { type: string, enum: [active, completed] }
                  reviews:
                    type: array
                    items:
                      type: object
                      properties:
                        seasonId: { type: string }
                        playerId: { type: string }
                        playerName: { type: string }
                        currentWrestler: { type: string }
                        divisionId: { type: string, description: Division at snapshot time }
                        currentDivisionId: { type: string, description: Division now }
                        promotionTrackId: { type: string }
                        promotionPct: { type: number }
                        relegationTrackId: { type: string }
                        relegationPct: { type: number }
                        seasonRank: { type: integer, description: "1-based rank in the division's season standings" }
                        flagged: { type: boolean }
                        recommendation: { type: string, enum: [promote, relegate, stay] }
                        decision: { type: string, enum: [promote, relegate, stay] }
                        decidedBy: { type: string }
                        decidedAt: { type: string, format: date-time }
                        toDivisionId: { type: string, description: Set once a promote or relegate moved the player }
                        createdAt: { type: string, format: date-time }
                        targets:
                          type: object
                          description: 'Per move, `{ ok: true, toDivisionId }` or `{ ok: false, code, message }` (e.g. AMBIGUOUS_TARGET, NO_DIVISION_ABOVE)'
                          properties:
                            promote: { type: object }
                            relegate: { type: object }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Season not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /progression/reviews/{seasonId}/apply:
    post:
      tags: [Progression]
      summary: Apply end-of-season movement decisions (Moderator+)
      description: >-
        Applies up to 50 decisions in order. Each promote / relegate runs the
        same move as POST /progression/players/{playerId}/execute on the
        review's promotion / relegation track; stay only records the decision.
        A failure for one player does not stop the others: every player gets a
        result, with the refusal (status, message and code such as
        HOLDS_DIVISION_TITLE, AMBIGUOUS_TARGET, REVIEW_NOT_FOUND, ALREADY_APPLIED
        or NO_TRACK) when it failed. Contenders are recalculated once for the
        batch.
      security: [{ BearerAuth: [] }]
      parameters:
        - name: seasonId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decisions]
              properties:
                decisions:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [playerId, decision]
                    properties:
                      playerId: { type: string }
                      decision: { type: string, enum: [promote, relegate, stay] }
                      toDivisionId: { type: string, description: Overrides the default target (needed when several sibling divisions qualify) }
                      force: { type: boolean, description: Proceed even if the player holds a title restricted to the old division }
                      announce: { type: boolean, description: Publish a News announcement for the move }
      responses:
        '200':
          description: Per-player results
          content:
            application/json:
              schema:
                type: object
                properties:
                  seasonId: { type: string }
                  applied: { type: integer }
                  failed: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        playerId: { type: string }
                        decision: { type: string, enum: [promote, relegate, stay] }
                        ok: { type: boolean }
                        move: { type: object, description: 'The executed move, as returned by POST /progression/players/{playerId}/execute' }
                        refusal:
                          type: object
                          properties:
                            status: { type: integer }
                            message: { type: string }
                            details: { type: object, properties: { code: { type: string } } }
        '400': { description: 'Invalid decisions', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Season not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
