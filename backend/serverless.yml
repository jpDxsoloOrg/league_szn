    # Faction-channel messages: one item per post in a faction's shared channel.
    # PK=factionId, SK=createdAt#messageId — composite SK keeps sort stable when
    # two posts land at the same millisecond. Audience-only (active members)
    # is enforced in the handler, not the table.
    FactionMessagesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.FACTION_MESSAGES_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: factionId
            AttributeType: S
          - AttributeName: createdAtMessageId
            AttributeType: S
        KeySchema:
          - AttributeName: factionId
            KeyType: HASH
          - AttributeName: createdAtMessageId
            KeyType: RANGE

    # 1:1 direct messages between two members of the same faction.
    # PK=factionId#threadKey, SK=createdAt#messageId. threadKey is the
    # deterministic sort of [a, b] joined by `#` so both sides see the same
    # thread. No GSI needed — the PK already scopes by thread.
    FactionDirectMessagesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.FACTION_DIRECT_MESSAGES_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: factionThreadKey
            AttributeType: S
          - AttributeName: createdAtMessageId
            AttributeType: S
          - AttributeName: factionId
            AttributeType: S
          - AttributeName: senderPlayerId
            AttributeType: S
          - AttributeName: recipientPlayerId
            AttributeType: S
        KeySchema:
          - AttributeName: factionThreadKey
            KeyType: HASH
          - AttributeName: createdAtMessageId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          # Enables listThreadsForPlayer: enumerate every thread a player is
          # part of inside a given faction (as sender).
          - IndexName: FactionSenderIndex
            KeySchema:
              - AttributeName: factionId
                KeyType: HASH
              - AttributeName: senderPlayerId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # …and as recipient.
          - IndexName: FactionRecipientIndex
            KeySchema:
              - AttributeName: factionId
                KeyType: HASH
              - AttributeName: recipientPlayerId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Rivalries (RIV-01): one base row per rivalry (recordType="META") plus
    # one row per participant (recordType="PARTICIPANT#<playerId>"). The
    # participant rows duplicate `participantId` so the ParticipantIndex GSI
    # can answer "all rivalries player X is in" cheaply. The META rows expose
    # `status` so the StatusIndex GSI can power admin moderation queues.
    # Both GSIs are sparse — items lacking the index attributes are skipped.
    RivalriesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.RIVALRIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: rivalryId
            AttributeType: S
          - AttributeName: recordType
            AttributeType: S
          - AttributeName: participantId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: rivalryId
            KeyType: HASH
          - AttributeName: recordType
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ParticipantIndex
            KeySchema:
              - AttributeName: participantId
                KeyType: HASH
              - AttributeName: rivalryId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Rivalry messages (RIV-01): every post on a rivalry thread. PK=rivalryId,
    # SK=createdAt#messageId so a single Query returns the whole thread in
    # time order with no GSI. Audience filtering (`all` vs `participants` vs
    # `admins`) lives on each row and is enforced by handlers.
    RivalryMessagesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.RIVALRY_MESSAGES_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: rivalryId
            AttributeType: S
          - AttributeName: createdAtMessageId
            AttributeType: S
        KeySchema:
          - AttributeName: rivalryId
            KeyType: HASH
          - AttributeName: createdAtMessageId
            KeyType: RANGE

    # Rivalry notes (RIV-01): booker/admin notes attached to a rivalry,
    # split into 'storyline' and 'plan'. PK=rivalryId, SK=noteId. The
    # NoteTypeIndex GSI lets admin tooling enumerate every note of a given
    # type across all rivalries (e.g. a global "all plans" view). Per-note
    # `visibility` is enforced in handlers based on the caller's role.
    RivalryNotesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.RIVALRY_NOTES_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: rivalryId
            AttributeType: S
          - AttributeName: noteId
            AttributeType: S
          - AttributeName: noteType
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: rivalryId
            KeyType: HASH
          - AttributeName: noteId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: NoteTypeIndex
            KeySchema:
              - AttributeName: noteType
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Match ratings (RIV-20): one row per (matchId, userId). Enforces "one
    # rating per viewer per match" via the (matchId, userId) composite key
    # plus a ConditionExpression on create. Aggregates (average / count /
    # match-of-the-night) are computed downstream in RIV-22.
    MatchRatingsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.MATCH_RATINGS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: matchId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: matchId
            KeyType: HASH
          - AttributeName: userId
            KeyType: RANGE

    # Progression (CUP-01): call-up / promotion / relegation tracks. New
    # tables land in the Overflow nested stack via stacks-map.js (root is at
    # the 500-resource limit).
    ProgressionTracksTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.PROGRESSION_TRACKS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: trackId
            AttributeType: S
        KeySchema:
          - AttributeName: trackId
            KeyType: HASH

    # One row per (player, track). TrackIndex lists a track's candidates
    # sorted by progressPct without a scan.
    PlayerProgressionTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.PLAYER_PROGRESSION_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: trackId
            AttributeType: S
          - AttributeName: progressPct
            AttributeType: N
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH
          - AttributeName: trackId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: TrackIndex
            KeySchema:
              - AttributeName: trackId
                KeyType: HASH
              - AttributeName: progressPct
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Audit log of consideration marks and executed moves. The sort key is
    # `${createdAt}#${eventId}` so same-millisecond events never collide.
    ProgressionEventsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.PROGRESSION_EVENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: createdAtEventId
            AttributeType: S
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH
          - AttributeName: createdAtEventId
            KeyType: RANGE

    # ECO-03: contract offers and contracts. PlayerIndex lists one player's
    # contracts newest first. New table, so stacks-map.js routes it (and its
    # GSI, which is part of the table resource) into the Overflow stack.
    ContractsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.CONTRACTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: contractId
            AttributeType: S
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: contractId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PlayerIndex
            KeySchema:
              - AttributeName: playerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    VideosTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.VIDEOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: videoId
            AttributeType: S
          - AttributeName: isPublished
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: videoId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PublishedIndex
            KeySchema:
              - AttributeName: isPublished
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    AnnouncementsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.ANNOUNCEMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: announcementId
            AttributeType: S
          - AttributeName: isActive
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: announcementId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ActiveIndex
            KeySchema:
              - AttributeName: isActive
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    NotificationsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.NOTIFICATIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
          - AttributeName: notificationId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: createdAt
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: NotificationIdIndex
            KeySchema:
              - AttributeName: notificationId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    WrestlerOverallsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.WRESTLER_OVERALLS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH

    TransferRequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.TRANSFER_REQUESTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PlayerTransfersIndex
            KeySchema:
              - AttributeName: playerId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    StorylineRequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.STORYLINE_REQUESTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: requesterId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: RequesterIndex
            KeySchema:
              - AttributeName: requesterId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    PresenceTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.PRESENCE_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    MatchmakingQueueTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.MATCHMAKING_QUEUE_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    MatchInvitationsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.MATCH_INVITATIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: invitationId
            AttributeType: S
          - AttributeName: toPlayerId
            AttributeType: S
          - AttributeName: fromPlayerId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: invitationId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ToPlayerIndex
            KeySchema:
              - AttributeName: toPlayerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: FromPlayerIndex
            KeySchema:
              - AttributeName: fromPlayerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    # ── Ledger (ECO-02) ── routed to the Overflow stack by stacks-map.js
    # (AWS::DynamoDB::Table). Append-only money log, newest first per player.
    LedgerTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.LEDGER_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: sortKey
            AttributeType: S
          - AttributeName: entryId
            AttributeType: S
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH
          - AttributeName: sortKey
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: EntryIdIndex
            KeySchema:
              - AttributeName: entryId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # One row per posting key, written with attribute_not_exists in the same
    # transaction as the entry so a retried posting never pays twice.
    LedgerIdempotencyTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.LEDGER_IDEMPOTENCY_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: idempotencyKey
            AttributeType: S
        KeySchema:
          - AttributeName: idempotencyKey
            KeyType: HASH
    # ── end Ledger (ECO-02) ──

    # ── GM interference (ECO-09) ── routed to the Overflow stack by
    # stacks-map.js (AWS::DynamoDB::Table). Paid requests to the GM;
    # PlayerIndex lists one player's requests newest first.
    GmInterferenceTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.GM_INTERFERENCE_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PlayerIndex
            KeySchema:
              - AttributeName: playerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
    # ── end GM interference (ECO-09) ──

    # ── Injuries (INJ-03) ── routed to the Overflow stack by stacks-map.js
    # (AWS::DynamoDB::Table). One row per injury, open or ended; the open
    # one is also copied onto Player.currentInjury.
    InjuriesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.INJURIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        DeletionProtectionEnabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        AttributeDefinitions:
          - AttributeName: playerId
            AttributeType: S
          - AttributeName: startedAt
            AttributeType: S
        KeySchema:
          - AttributeName: playerId
            KeyType: HASH
          - AttributeName: startedAt
            KeyType: RANGE
    # ── end Injuries (INJ-03) ──

    ImagesBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:provider.environment.IMAGES_BUCKET}
        VersioningConfiguration:
          Status: Enabled
        # Versioning keeps every overwritten or deleted object, so old
        # versions expire after 90 days to keep storage bounded.
        LifecycleConfiguration:
          Rules:
            - Id: ExpireNoncurrentVersions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: 90
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - HEAD
                - PUT
                - POST
              AllowedOrigins:
                - '*'
              ExposedHeaders:
                - Content-Length
                - Content-Range
                - Accept-Ranges
                - Content-Type
                - ETag
              MaxAge: 3000

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action:
                - s3:GetObject
              Resource:
                - !Sub '${ImagesBucket.Arn}/*'

    # CloudFront Distribution for HTTPS frontend
    # Uses S3 website endpoint (existing public bucket) instead of OAI
    FrontendCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: CloudFront distribution for ${self:custom.frontendDomain.${self:provider.stage}, 'leagueszn.jpdxsolo.com'}
          DefaultRootObject: index.html
          Aliases:
            - ${self:custom.frontendDomain.${self:provider.stage}, 'leagueszn.jpdxsolo.com'}
          Origins:
            - Id: S3WebsiteOrigin
              DomainName: ${self:custom.frontendBucket.${self:provider.stage}, 'leagueszn.jpdxsolo.com'}.s3-website-us-east-1.amazonaws.com
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: http-only
            - Id: S3MediaOrigin
              DomainName: ${self:provider.environment.IMAGES_BUCKET}.s3.us-east-1.amazonaws.com
              S3OriginConfig:
                OriginAccessIdentity: ''
          CacheBehaviors:
            - PathPattern: videos/*
              TargetOriginId: S3MediaOrigin
              ViewerProtocolPolicy: redirect-to-https
              ResponseHeadersPolicyId: ${self:custom.securityHeadersPolicyId}
              AllowedMethods:
                - GET
                - HEAD
                - OPTIONS
              CachedMethods:
                - GET
                - HEAD
              Compress: false
              ForwardedValues:
                QueryString: false
                Cookies:
                  Forward: none
              DefaultTTL: 86400
              MaxTTL: 31536000
              MinTTL: 0
          DefaultCacheBehavior:
            TargetOriginId: S3WebsiteOrigin
            ViewerProtocolPolicy: redirect-to-https
            ResponseHeadersPolicyId: ${self:custom.securityHeadersPolicyId}
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            DefaultTTL: 86400
            MaxTTL: 31536000
            MinTTL: 0
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.certificateArn.${self:provider.stage}}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          HttpVersion: http2
          PriceClass: PriceClass_100

  Outputs:
    CloudFrontDistributionId:
      Description: CloudFront Distribution ID for cache invalidation
      Value: !Ref FrontendCloudFrontDistribution
      Export:
        Name: ${self:service}-${self:provider.stage}-CloudFrontDistributionId
    CloudFrontDomainName:
      Description: CloudFront Distribution Domain Name
      Value: !GetAtt FrontendCloudFrontDistribution.DomainName
      Export:
        Name: ${self:service}-${self:provider.stage}-CloudFrontDomainName
    CognitoUserPoolId:
      Description: Cognito User Pool ID
      Value: !Ref LeagueUserPool
      Export:
        Name: ${self:service}-${self:provider.stage}-CognitoUserPoolId
    CognitoUserPoolClientId:
      Description: Cognito User Pool Client ID
      Value: !Ref LeagueUserPoolClient
      Export:
        Name: ${self:service}-${self:provider.stage}-CognitoUserPoolClientId
