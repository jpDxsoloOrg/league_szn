# gitleaks configuration, used by ci-checks.yml. Extends the default rules.
title = "league_szn"

[extend]
useDefault = true

[allowlist]
description = "Values that match a rule but are not secrets"
regexes = [
  # sessionStorage key name in PresenceContext.tsx
  '''wwe2k\.presenceEnabled''',
  # i18n keys for match sim play-by-play beats (`key: 'sim.beats.<type>.v<n>'`)
  '''sim\.beats\.[A-Za-z]+\.v[0-9]+''',
]
