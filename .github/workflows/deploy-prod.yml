name: Deploy to Production

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

jobs:
  test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --project tsconfig.app.json --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

  checks:
    name: Backend Checks & Secret Scan
    uses: ./.github/workflows/ci-checks.yml

  deploy-prod:
    name: Deploy to Production Environment
    needs: [test, checks]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://leagueszn.jpdxsolo.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check generated stacks for dependency cycles
        working-directory: backend
        run: |
          npx serverless package --stage dev
          node scripts/check-stack-cycles.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PROD_ACM_CERTIFICATE_ARN: ${{ secrets.PROD_ACM_CERTIFICATE_ARN }}
          ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}

      - name: Check generated stacks against resource limits
        working-directory: backend
        run: npm run check-stack-limits

      # INFRA-207 cut-over gate (plan section 7.3). Reads live state and refuses a
      # template that would undo the /{proxy+} migration on this stage.
      - name: Check API cut-over gate
        working-directory: backend
        run: node scripts/check-api-cutover.js --stage dev

      - name: Deploy backend to production
        id: deploy_backend
        working-directory: backend
        run: npx serverless deploy --stage dev
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          PROD_ACM_CERTIFICATE_ARN: ${{ secrets.PROD_ACM_CERTIFICATE_ARN }}
          ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}

      # API Gateway Deployments are snapshots taken before CloudFormation cleanup,
      # so a deploy that removes gateway paths leaves them on the stage until a
      # new deployment is created (INFRA-207 plan section 4). The previous
      # deploymentId is logged for rollback with aws apigateway update-stage.
      # continue-on-error keeps a failed refresh from skipping the frontend
      # deploy; the "Fail if API stage refresh failed" step at the end of the job
      # still turns the run red so the stale stage gets noticed.
      - name: Refresh API stage deployment
        id: refresh_stage
        if: steps.deploy_backend.outcome == 'success'
        continue-on-error: true
        run: |
          REST_API_ID=$(aws cloudformation describe-stack-resource \
            --stack-name wwe-2k-league-api-dev \
            --logical-resource-id ApiGatewayRestApi \
            --query "StackResourceDetail.PhysicalResourceId" \
            --output text)
          PREVIOUS_DEPLOYMENT_ID=$(aws apigateway get-stage \
            --rest-api-id "$REST_API_ID" \
            --stage-name dev \
            --query deploymentId \
            --output text)
          echo "Previous dev stage deploymentId (rollback target): $PREVIOUS_DEPLOYMENT_ID"
          NEW_DEPLOYMENT_ID=$(aws apigateway create-deployment \
            --rest-api-id "$REST_API_ID" \
            --stage-name dev \
            --description "post-deploy refresh $GITHUB_SHA" \
            --query id \
            --output text)
          echo "New dev stage deploymentId: $NEW_DEPLOYMENT_ID"

      - name: Extract Cognito IDs from CloudFormation
        id: cognito
        # Runs after a failed deploy too: a rollback does not restore the triggers.
        if: ${{ !cancelled() && steps.deploy_backend.conclusion != 'skipped' }}
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name wwe-2k-league-api-dev \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name wwe-2k-league-api-dev \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolClientId'].OutputValue" \
            --output text)
          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "Cognito User Pool ID: $USER_POOL_ID"
          echo "Cognito Client ID: $CLIENT_ID"

      - name: Wire Cognito post-confirmation trigger
        if: ${{ !cancelled() && steps.deploy_backend.conclusion != 'skipped' }}
        # Idempotent — attaches the PostConfirmation Lambda to the User Pool so
        # new signups auto-receive the Wrestler role + Player record + default
        # division. CloudFormation can't wire this itself due to a circular
        # dependency between the Lambda and the User Pool.
        working-directory: backend
        run: ./scripts/setup-cognito.sh "${{ steps.cognito.outputs.user_pool_id }}" dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          VITE_AWS_REGION: us-east-1

      # Upload order matters. Hashed assets go first, so a new index.html never
      # points at a file that is missing. assets/ is never pruned, because tabs
      # still running the previous build load their chunks from it. index.html
      # goes last, as no-cache, so browsers always pick up the current build.
      - name: Upload hashed assets
        working-directory: frontend
        run: |
          aws s3 sync dist/assets s3://leagueszn.jpdxsolo.com/assets \
            --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload remaining static files
        working-directory: frontend
        run: |
          aws s3 sync dist s3://leagueszn.jpdxsolo.com --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --exclude "sw.js" \
            --exclude "sw-kill.js" \
            --exclude "manifest.webmanifest" \
            --exclude "*.map" \
            --cache-control "public, max-age=300"

      # The service worker and manifest must never sit in a cache: browsers look
      # for a new sw.js on every navigation. Without the right content type the
      # browser refuses the worker, and CloudFront answers a missing /sw.js with
      # index.html, so these are uploaded explicitly.
      - name: Upload service worker and manifest as no-cache
        working-directory: frontend
        run: |
          aws s3 cp dist/sw.js s3://leagueszn.jpdxsolo.com/sw.js \
            --cache-control "no-cache" \
            --content-type "application/javascript"
          aws s3 cp dist/sw-kill.js s3://leagueszn.jpdxsolo.com/sw-kill.js \
            --cache-control "no-cache" \
            --content-type "application/javascript"
          aws s3 cp dist/manifest.webmanifest s3://leagueszn.jpdxsolo.com/manifest.webmanifest \
            --cache-control "no-cache" \
            --content-type "application/manifest+json"

      - name: Upload index.html as no-cache
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html s3://leagueszn.jpdxsolo.com/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Get CloudFront Distribution ID
        id: cloudfront
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name wwe-2k-league-api-dev \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --paths "/*"

      - name: Create deployment summary
        run: |
          echo "## Production Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://leagueszn.jpdxsolo.com" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ steps.cloudfront.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Fail if API stage refresh failed
        if: ${{ !cancelled() && steps.refresh_stage.outcome == 'failure' }}
        run: |
          echo "::error::Refreshing the dev API stage deployment failed. The stage may still serve removed gateway paths; run aws apigateway create-deployment --stage-name dev by hand (check the CI role's apigateway:POST permission on /restapis/*/deployments)."
          exit 1
