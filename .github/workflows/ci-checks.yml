name: CI Checks

# Called by the deploy workflows so that a failure here blocks the deploy.
on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.21.2'
  GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba

jobs:
  backend:
    name: Backend Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Typecheck
        working-directory: backend
        run: npx tsc --project tsconfig.json --noEmit

      - name: Unit tests
        working-directory: backend
        run: npm test

      - name: Check embedded API docs are current
        working-directory: backend
        run: |
          npm run embed-docs
          git diff --exit-code -- functions/docs/docsEmbed.generated.ts

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" dir . \
            --config .github/workflows/gitleaks.toml \
            --redact --no-banner

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$RUNNER_TEMP/gitleaks" git . \
            --config .github/workflows/gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact --no-banner
