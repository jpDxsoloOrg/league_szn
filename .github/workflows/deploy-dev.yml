name: Deploy to Dev

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '24'

jobs:
  test:
    name: Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --project tsconfig.app.json --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

  checks:
    name: Backend Checks & Secret Scan
    uses: ./.github/workflows/ci-checks.yml

  deploy-dev:
    name: Deploy to Dev Environment
    needs: [test, checks]
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Deploy backend to dev
        working-directory: backend
        run: npx serverless deploy --stage devtest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          DEV_ACM_CERTIFICATE_ARN: ${{ secrets.DEV_ACM_CERTIFICATE_ARN }}
          ADMIN_SETUP_KEY: ${{ secrets.ADMIN_SETUP_KEY }}

      - name: Extract Cognito IDs from CloudFormation
        id: cognito
        run: |
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name wwe-2k-league-api-devtest \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolId'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name wwe-2k-league-api-devtest \
            --query "Stacks[0].Outputs[?OutputKey=='CognitoUserPoolClientId'].OutputValue" \
            --output text)
          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "client_id=$CLIENT_ID" >> $GITHUB_OUTPUT
          echo "Cognito User Pool ID: $USER_POOL_ID"
          echo "Cognito Client ID: $CLIENT_ID"

      - name: Wire Cognito post-confirmation trigger
        # Idempotent — attaches the PostConfirmation Lambda to the User Pool so
        # new signups auto-receive the Wrestler role + Player record + default
        # division. CloudFormation can't wire this itself due to a circular
        # dependency between the Lambda and the User Pool.
        working-directory: backend
        run: ./scripts/setup-cognito.sh "${{ steps.cognito.outputs.user_pool_id }}" devtest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build -- --mode devtest
        env:
          VITE_API_BASE_URL: ${{ secrets.DEV_API_BASE_URL }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.user_pool_id }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          VITE_AWS_REGION: us-east-1

      # Upload order matters. Hashed assets go first, so a new index.html never
      # points at a file that is missing. assets/ is never pruned, because tabs
      # still running the previous build load their chunks from it. index.html
      # goes last, as no-cache, so browsers always pick up the current build.
      - name: Upload hashed assets
        working-directory: frontend
        run: |
          aws s3 sync dist/assets s3://dev.leagueszn.jpdxsolo.com/assets \
            --exclude "*.map" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload remaining static files
        working-directory: frontend
        run: |
          aws s3 sync dist s3://dev.leagueszn.jpdxsolo.com --delete \
            --exclude "assets/*" \
            --exclude "index.html" \
            --exclude "*.map" \
            --cache-control "public, max-age=300"

      - name: Upload index.html as no-cache
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html s3://dev.leagueszn.jpdxsolo.com/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Get CloudFront Distribution ID
        id: cloudfront
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name wwe-2k-league-api-devtest \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudfront.outputs.distribution_id }} \
            --paths "/*"

      # E2E tests and screenshots temporarily disabled
      # - name: Install E2E test dependencies
      #   working-directory: e2e
      #   run: npm ci
      #
      # - name: Install Playwright browsers
      #   working-directory: e2e
      #   run: npx playwright install chromium --with-deps
      #
      # - name: Run E2E tests
      #   working-directory: e2e
      #   run: npx playwright test --project=chromium
      #   env:
      #     TEST_ENV: dev
      #     E2E_ADMIN_USERNAME: ${{ secrets.E2E_ADMIN_USERNAME }}
      #     E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      #
      # - name: Upload E2E test results
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: e2e-test-results
      #     path: e2e/reports/
      #     retention-days: 30
      #
      # - name: Capture screenshots of dev site
      #   working-directory: e2e
      #   run: npm run screenshots
      #   env:
      #     SCREENSHOT_BASE_URL: https://dev.leagueszn.jpdxsolo.com
      #
      # - name: Upload screenshots
      #   uses: actions/upload-artifact@v4
      #   if: always()
      #   with:
      #     name: page-screenshots
      #     path: screenshots/
      #     retention-days: 30

      - name: Deployment summary
        if: always()
        run: |
          echo "## Dev Deployment: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://dev.leagueszn.jpdxsolo.com" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ steps.cloudfront.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${GITHUB_SHA::7}\`" >> $GITHUB_STEP_SUMMARY
